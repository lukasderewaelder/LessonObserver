name: Android APK

# Release: Jeder Push auf main baut eine signierte APK und veröffentlicht sie als Release v1.0.<Laufnummer>.
# Alternativ: eigenen Tag pushen (z. B. v1.2.0) -> APK hängt am Release mit dieser Version.
# Manuell (Actions -> Run workflow): baut eine APK als Artifact (signiert, wenn die Secrets gesetzt sind, sonst Debug).
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Das Android-SDK ist auf dem Runner vorinstalliert (sdkmanager liegt dort, aber nicht im PATH)
      - name: Android-SDK vorbereiten
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "SDK=$SDK  sdkmanager=$SDKM"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"

      - name: Web-App bauen und mit Android synchronisieren
        run: |
          npm ci
          npm run sync

      - name: Version setzen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then V="1.0.${{ github.run_number }}"
          else V="0.0.0-dev"; fi
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Keystore bereitstellen
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../LessonObserver.apk
          else
            echo "::warning::Kein Keystore hinterlegt – es wird eine Debug-APK gebaut (nicht für Updates über eine Release-Installation geeignet)."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../LessonObserver.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LessonObserver-apk
          path: LessonObserver.apk

      - name: An GitHub-Release anhängen
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: LessonObserver.apk
          generate_release_notes: true
