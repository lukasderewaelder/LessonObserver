<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mitarbeit">
<meta name="format-detection" content="telephone=no">
<meta name="app-version" content="2026-10-19.2">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131B" media="(prefers-color-scheme: dark)">
<title>Mitarbeit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#17202F; --muted:#586275; --line:#D5DBE4;
  --brand:#25406B; --on-brand:#FFFFFF;
  --r2:#0F7A63; --r1:#2F8F6A; --r0:#6E798C; --rm1:#B8651A; --rm2:#C0392B;
  --joker:#E0A100; --on-joker:#3A2A00; --joker-soft:#FFF1C2;
  --danger:#B3261E;
  --dockh:0px; --cc:#2F5FD0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E131B;--surface:#161D28;--surface2:#1D2633;--ink:#E7ECF4;--muted:#9BA7B9;--line:#2A3444;
        --brand:#9DBBEA;--on-brand:#0E131B;--joker-soft:#3A2F09;--danger:#F2766E}
}
.r2{--c:var(--r2)} .r1{--c:var(--r1)} .r0{--c:var(--r0)} .rm1{--c:var(--rm1)} .rm2{--c:var(--rm2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior-y:contain}
.view,.sheet{overscroll-behavior:contain}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 var(--ui);-webkit-font-smoothing:antialiased;touch-action:manipulation}
body.overlay{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h2,h3{margin:0}
.muted{color:var(--muted)}

/* Kopfbereich */
#hdr{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;border-top:4px solid var(--cc);border-bottom:1px solid var(--line)}
.hin{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"c d" "t t";gap:6px 10px;align-items:center;max-width:1400px;margin:0 auto}
.cbtn{grid-area:c;display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left;padding:0}
.ct{font:600 20px/1.15 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cbtn .ct::after{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);margin-left:9px}
.cs{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.datechip{grid-area:d;display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.datechip.alt{border-color:var(--joker);background:var(--joker-soft)}
.pill-btn{min-height:38px;padding:0 12px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-weight:600;font-size:14px}
.tabs{grid-area:t;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.tab{padding:6px 2px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.tab[aria-selected=true]{background:var(--cc);color:#fff}

#main{padding:8px 10px calc(var(--dockh) + 20px + env(safe-area-inset-bottom));max-width:1400px;margin:0 auto}
body.nodock #main{padding-bottom:calc(20px + env(safe-area-inset-bottom))}

/* Werkzeugleiste */
.tbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 0 8px}
.tbar .btn{height:38px;padding:0 12px;font-size:14px;flex:0 0 auto}
.tbar select{padding:7px 8px}
.sel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:1;min-width:0}
.sel select{flex:1;min-width:0;width:100%;text-overflow:ellipsis}
.sel span{flex:0 0 auto}
select,.inp,textarea,input{font-family:var(--ui)}
select,.inp,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
select{padding-right:6px}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{min-width:38px;height:32px;border-radius:7px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 12px;margin-bottom:10px;border:1.5px solid var(--joker);background:var(--joker-soft);border-radius:10px;font-size:13.5px;line-height:1.35}
.banner>span{flex:1 1 220px}
.banner.warn{border-color:var(--danger)}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}

/* Kacheln */
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:6px;--tmin:200px}
.grid.c3{--tmin:160px}
.tile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;display:flex;flex-direction:column;gap:2px;padding:6px 8px 6px 9px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc,var(--line));border-radius:8px;transition:transform .08s}
.tile:active{transform:scale(.97)}
.fn{display:block;font:600 18px/1.15 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.ln{display:block;font-size:13px;line-height:1.25;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chips{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;overflow:hidden;min-height:20px;margin-top:2px}
.chip{min-width:20px;height:20px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;font:700 12px/1 var(--ui);font-style:normal;color:#fff;background:var(--c,var(--muted))}
.chip.jk{background:var(--joker);color:var(--on-joker)}
.chip.tg{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.chip.st{background:transparent;color:var(--muted);border:1px solid var(--muted);font-weight:600}
.chip.more{background:transparent;color:var(--muted)}
.pips{display:flex;gap:3px;align-items:center;flex:0 0 auto;margin-left:auto;font-size:11.5px;color:var(--muted)}
.pip{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--joker)}
.pip.f{background:var(--joker)}
.jb{flex:0 0 auto;font:700 11px/1 var(--ui);padding:3px 7px;border-radius:999px;background:var(--joker);color:var(--on-joker);white-space:nowrap}
.grid.c3 .tile{padding:7px 6px 7px 8px}
.grid.c3 .jl{display:none}
@media (hover:hover){.tile:hover{border-color:var(--cc)}.stamp:hover,.xs:hover,.rbtn:hover{filter:brightness(1.08)}.xs:hover{border-color:var(--ink)}}
.grid.c3 .pip{width:7px;height:7px}
.grid.c3 .pips{gap:2px}
.grid.c3 .fn{font-size:16px}
.grid.c3 .ln{font-size:12px}
@keyframes stamp{0%{transform:scale(1)}35%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(1.8);opacity:.2}100%{transform:scale(1);opacity:1}}
.tile.flash{animation:stamp .28s ease-out}
.tile.flash .chip.nw{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){.tile.flash,.tile.flash .chip.nw{animation:none}}

/* Stempelleiste */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
body.nodock #dock{display:none}
.dhint{font-size:12.5px;line-height:1.3;color:var(--muted);min-height:24px;margin:0 2px 3px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dhint .hl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhint .stop{flex:0 0 auto;font-weight:700;font-size:13px;color:var(--brand);padding:6px 4px}
.dhint b{color:var(--ink)}
.dhint select{padding:4px 6px;font-size:14px;max-width:150px;flex:0 1 auto}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:560px;margin:0 auto}
.stamp{height:44px;border-radius:12px;color:#fff;background:var(--c);font:700 26px/1 var(--ui);transition:transform .08s,opacity .12s}
.stamp:active{transform:scale(.95)}
#dock.armed .stamp:not(.on){opacity:.5}
.stamp.on{outline:3px solid var(--ink);outline-offset:2px}
.xrow{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.xrow::-webkit-scrollbar{display:none}
.xs{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);font-weight:600;font-size:15px;white-space:nowrap}
.xs.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xs.joker{border-color:var(--joker)}
.xs.joker.on{background:var(--joker);color:var(--on-joker)}
.xs svg{width:18px;height:18px}
#dock.armed .xs:not(.on):not(.pick){opacity:.5}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--dockh) + 12px);transform:translateX(-50%);z-index:70;display:none;align-items:center;gap:12px;width:max-content;max-width:min(92vw,520px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
#toast.show{display:flex}
#toast.gold{background:var(--joker);color:var(--on-joker)}
#toast button{font-weight:700;padding:6px 10px;border-radius:8px;border:1.5px solid currentColor;white-space:nowrap}
body.nodock #toast{bottom:calc(16px + env(safe-area-inset-bottom))}
body.overlay #toast{bottom:auto;top:calc(env(safe-area-inset-top) + 12px)}
body.view-open #toast{top:auto;bottom:calc(16px + env(safe-area-inset-bottom))}

/* Sheet */
#sheetWrap{position:fixed;inset:0;z-index:40;display:none}
#sheetWrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,12,20,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 32px rgba(0,0,0,.25);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.sh-head h2{font:600 24px/1.15 var(--ui)}
.sh-head h2 span{font-weight:400;color:var(--muted)}
.sh-sub{font-size:13px;color:var(--muted);margin-top:2px}
.sec{margin-top:16px}
.sec>h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.rbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;border-radius:12px;background:var(--c);color:#fff}
.rbtn b{font:700 24px/1 var(--ui)}
.rbtn small{font-size:10.5px;opacity:.95}
.rbtn:active{transform:scale(.96)}
.jline{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wrap{display:flex;gap:6px;flex-wrap:wrap}
.rchip,.act{min-height:40px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);font-weight:600;font-size:15px}
.act.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.joker,.rchip{border-color:var(--joker)}
.act.joker{background:var(--joker);color:var(--on-joker)}
.act:disabled{opacity:.45}
.act small{font-weight:500;opacity:.85}
.today{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;align-items:center}
.tchip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 4px 0 8px;border-radius:7px;background:var(--c,var(--surface2));color:#fff;font-weight:700;font-size:13px}
.tchip.jk{background:var(--joker);color:var(--on-joker)}
.tchip.tg,.tchip.st{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.tchip i{font-style:normal;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;opacity:.85;font-size:15px}
textarea{width:100%;resize:vertical;min-height:62px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{font-weight:600;color:var(--brand);padding:10px 0}
.clist{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.crow{display:flex;flex-direction:column;align-items:flex-start;padding:11px 13px;border:1.5px solid var(--line);border-left:7px solid var(--k,var(--line));border-radius:10px;background:var(--surface2);text-align:left}
.crow.on{outline:2px solid var(--k,var(--brand));outline-offset:-1px}
.crow b{font:600 18px/1.2 var(--ui)}
.crow small{color:var(--muted);font-size:13px}

/* Vollbild-Ansichten */
.view{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.view.open{display:block}
.vhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.vhead h2{font:600 20px/1.15 var(--ui);text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbody{padding:14px 14px calc(34px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.fld small{color:var(--muted);font-size:12.5px}
.vbody h3{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.srow{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;margin-bottom:6px}
.ico{width:40px;height:44px;border-radius:9px;border:1.5px solid var(--line);color:var(--muted);font-size:16px;background:var(--surface)}
details.box{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;margin-top:10px}
details.box summary{padding:12px 0;font-weight:600;cursor:pointer}
details.box[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details.box>*:last-child{margin-bottom:12px}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.danger-zone{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

/* Auswertung */
.rng{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.rng::-webkit-scrollbar{display:none}
.rng button{flex:0 0 auto;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.rng button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dates{display:flex;gap:8px;align-items:center;margin:2px 0 10px;font-size:14px;color:var(--muted)}
.dates input{flex:1}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
.stat{padding:9px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.stat b{display:block;font:600 24px/1.1 var(--ui)}
.stat span{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface2);position:sticky;top:0}
.tbl th button{font-weight:600;color:inherit;font-size:inherit;padding:2px 0}
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;text-align:left;background:var(--surface);border-right:1px solid var(--line);z-index:1}
.tbl th:first-child{background:var(--surface2);z-index:2}
.tbl td:first-child button{text-align:left;font-weight:600}
.tbl td:first-child small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.avg{display:inline-block;min-width:38px;padding:3px 7px;border-radius:6px;background:var(--c,var(--line));color:#fff;font-weight:700}
.dist{display:inline-flex;width:84px;height:10px;border-radius:5px;overflow:hidden;background:var(--line);vertical-align:middle}
.dist i{display:block;height:100%;background:var(--c)}
.none-list{display:flex;gap:6px;flex-wrap:wrap}
.none-list button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:14px}

/* Verlauf */
.spark{display:block;width:auto;max-width:100%;height:64px;margin:6px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.dh{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.ev{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:5px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ev .chip{flex:0 0 auto;min-width:30px;height:26px}
.ev .tx{flex:1;min-width:0;font-size:15px}
.ev .tx small{display:block;color:var(--muted);font-size:12.5px}
.ev .dt{position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;color:var(--muted);border-radius:8px;cursor:pointer}
.ev .dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.ev button{width:36px;height:36px;color:var(--muted);font-size:16px;border-radius:8px}

/* Zufall */
.pickbox{text-align:center;padding:26px 8px 10px}
.pickbox .fnb{font:600 clamp(38px,13vw,60px)/1.05 var(--ui);word-break:break-word}
.pickbox .lnb{font:400 clamp(20px,6vw,28px)/1.2 var(--ui);color:var(--muted);margin-top:4px;min-height:34px}
.pickbox .runde{font-size:13px;color:var(--muted);margin-top:14px}
.big{height:56px;font-size:18px}

code{font:inherit;font-weight:600;background:var(--surface2);padding:0 4px;border-radius:4px}
.btn:disabled{opacity:.45}
.seg.wide button{height:auto;min-height:38px;padding:6px 10px;line-height:1.2}

/* Einstellungen */
.sect{margin-bottom:22px}
.sect>h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.setrow small{display:block;color:var(--muted);font-size:12.5px}
.listrow{display:grid;grid-template-columns:1fr 40px;gap:6px;margin-bottom:6px}
.listrow.tag{grid-template-columns:1fr 78px 40px}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s}

<script>
(function(){
'use strict';

/* ───────── Grundlagen ───────── */
var KEY='mitarbeit-app-v1';
var PAL=['#2F5FD0','#0E7C70','#2E7D32','#B45309','#C62828','#7C3AED','#C2185B','#546378'];
var ccol=function(c){return (c&&c.color)||PAL[0];};
var RATINGS=[
  {k:'r2', v:2,  sym:'++', name:'sehr gut'},
  {k:'r1', v:1,  sym:'+',  name:'gut'},
  {k:'r0', v:0,  sym:'○',  name:'mittel'},
  {k:'rm1',v:-1, sym:'−',  name:'schwach'},
  {k:'rm2',v:-2, sym:'−−', name:'sehr schwach'}
];
var byV=function(v){return RATINGS.filter(function(r){return r.v===v;})[0];};
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

/* Automatische Sicherungen: nach jeder Änderung ein Schnappschuss in IndexedDB (die letzten 20 plus je einer pro Tag der letzten 14 Tage) */
var idbP=null,snapTimer=null,lastSnapKey='';
function idb(){
  if(idbP)return idbP;
  idbP=new Promise(function(res,rej){
    try{
      var r=indexedDB.open('mitarbeit-backup',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('snaps',{keyPath:'ts'});};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){rej(r.error);};
    }catch(e){rej(e);}
  });
  return idbP;
}
function snapOp(mode,fn){
  return idb().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction('snaps',mode),out=fn(tx.objectStore('snaps'));
    tx.oncomplete=function(){res(out&&'result' in out?out.result:undefined);};
    tx.onerror=function(){rej(tx.error);};
  });});
}
function snapList(){return snapOp('readonly',function(st){return st.getAll();}).then(function(a){return (a||[]).sort(function(x,y){return y.ts-x.ts;});});}
function snapClear(){return snapOp('readwrite',function(st){return st.clear();}).catch(function(){});}
function snapSoon(){clearTimeout(snapTimer);snapTimer=setTimeout(function(){snapNow();},1200);}
function snapNow(force){
  var key=JSON.stringify([state.courses,state.events]);
  if(!force&&key===lastSnapKey)return Promise.resolve();
  if(!state.courses.length&&!state.events.length)return Promise.resolve();
  lastSnapKey=key;
  var rec={ts:Date.now(),json:JSON.stringify(state),nc:state.courses.length,ne:state.events.length};
  return snapOp('readwrite',function(st){return st.put(rec);}).then(snapPrune).catch(function(){});
}
function snapPrune(){
  return snapList().then(function(list){
    var keep={},days={};
    list.forEach(function(r,i){
      if(i<20)keep[r.ts]=1;
      var d=ymd(new Date(r.ts));
      if(!days[d]){days[d]=1;if(Object.keys(days).length<=14)keep[r.ts]=1;}
    });
    var del=list.filter(function(r){return !keep[r.ts];});
    if(!del.length)return;
    return snapOp('readwrite',function(st){del.forEach(function(r){st.delete(r.ts);});});
  });
}
/* Speicher des Browsers weg, aber Schnappschüsse da: automatisch zurückholen */

}
function snapRestore(ts){
  snapList().then(function(list){
    var r=list.filter(function(x){return x.ts===+ts;})[0];if(!r)return;
    var when=fmtDate(ymd(new Date(r.ts)),true)+' '+p2(new Date(r.ts).getHours())+':'+p2(new Date(r.ts).getMinutes());
    if(!confirm('Stand vom '+when+' ('+r.nc+' Kurs(e), '+r.ne+' Einträge) wiederherstellen? Der aktuelle Stand wird vorher gesichert.'))return;
    snapNow(true).then(function(){
      state=normalize(JSON.parse(r.json));lastSnapKey='';save();
      ui.stamp=null;ui.sel=[];ui.view=null;ui.draft=null;ui.pick=null;renderView();closeSheet();render();toast('Sicherung vom '+when+' geladen');
    });
  });
}

/* Android-App (Capacitor): Teilen, Zurück-Taste und Wachhalten laufen über native Plugins */
var CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
function plug(n){return NATIVE&&CAP.Plugins?CAP.Plugins[n]||null:null;}
function blobB64(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1]||'');};fr.onerror=function(){rej(fr.error);};fr.readAsDataURL(blob);});}
/* Datei in den App-Cache schreiben und das Android-Teilen-Fenster öffnen (Drive, Dateien, E-Mail, „Öffnen mit“). true = geteilt, false = abgebrochen/Fehler */
function nativeShare(blob,name){
  var fs=plug('Filesystem'),sh=plug('Share');
  if(!fs||!sh){toast('Teilen ist in dieser App-Version nicht verfügbar.');return Promise.resolve(false);}
  return blobB64(blob).then(function(b64){
    return fs.writeFile({path:name,data:b64,directory:'CACHE'});
  }).then(function(w){
    return sh.share({title:name,url:w.uri,dialogTitle:name}).then(function(){return true;});
  }).catch(function(e){
    if(/cancel/i.test((e&&e.message)||String(e)))return false;
    toast('Die Datei konnte nicht geteilt werden.');return false;
  });
}

function stats(evs,lo,hi){
  var o={n:0,sum:0,dist:[0,0,0,0,0],tags:{},jok:0,red:0,avg:null};
  evs.forEach(function(e){
    if(!inB(e,[lo,hi]))return;
    if(e.type==='rate'){o.n++;o.sum+=3-e.val;o.dist[2-e.val]++;}
    else if(e.type==='tag')o.tags[e.tag]=(o.tags[e.tag]||0)+1;
    else if(e.type==='joker')o.jok+=(e.n||1);

  });
  o.avg=o.n?o.sum/o.n:null;

}

function mkEvent(sid,type,extra){

function doStamp(key,sid,opt){
  opt=opt||{};
  var TU=opt.quiet?function(){}:function(){buzz();toastUndoIds.apply(null,arguments);};
  var c=course(),s=stu(sid);
  if(!c||!s)return false;
  var rt=RATINGS.filter(function(r){return r.k===key;})[0];
  var ev;
  if(rt){
    ev=mkEvent(sid,'rate',{val:rt.v});state.events.push(ev);save();
    TU(s.first+': '+rt.sym+' '+rt.name,[ev.id]);return true;
  }
  if(key==='joker'){
    var before=jInfoNow(c,sid);
    ev=mkEvent(sid,'joker',opt.reason?{reason:opt.reason}:{});state.events.push(ev);save();
    var got=jInfoNow(c,sid).earned>before.earned;
    TU(s.first+': ★ Joker-Punkt'+(opt.reason?' ('+opt.reason+')':'')+(got?' – Joker erreicht!':''),[ev.id],got);return true;
  }
  if(key==='redeem'){
    if(jInfoNow(c,sid).avail<1){toast(s.first+' hat keinen Joker zum Einlösen');return false;}
    ev=mkEvent(sid,'redeem');state.events.push(ev);save();
    TU(s.first+': Joker eingelöst',[ev.id]);return true;
  }
  if(key.indexOf('tag:')===0){
    var t=state.settings.tags.filter(function(x){return x.id===key.slice(4);})[0];
    if(!t)return false;
    ev=mkEvent(sid,'tag',{tag:t.id,tn:t.name,sh:t.short||t.name.slice(0,3)});state.events.push(ev);save();
    TU(s.first+': '+t.name,[ev.id]);return true;
  }
  return false;
}

function comboCourse(ctx){return ctx==='nt'?state.courses.filter(function(c){return c.id===ui.nt.cid;})[0]:course();}
function comboMatches(ctx,q,all){
  var c=comboCourse(ctx),ids=comboIds(ctx);if(!c)return [];
  var toks=nrm(q).split(/\s+/).filter(Boolean);
  var list=c.students.filter(function(s){return ids.indexOf(s.id)<0;});
  if(toks.length)list=list.filter(function(s){var w=nrm(s.first+' '+s.last).split(/\s+/);return toks.every(function(t){return w.some(function(x){return x.indexOf(t)===0;});});});
  list.sort(function(a,b){return (a.last+' '+a.first).localeCompare(b.last+' '+b.first,'de');});
  return all?list:list.slice(0,12);
}

function comboCommit(ctx){

/* ───────── Tab: Unterricht ───────── */
function sortStudents(c,idx){
  var list=c.students.slice();
  var nm=function(s){return (s.last+' '+s.first).toLowerCase();};
  var mode=state.settings.sort;
  if(mode==='first')list.sort(function(a,b){return (a.first+' '+a.last).localeCompare(b.first+' '+b.last,'de');});
  else if(mode==='long'){
    var last=function(s){var m=0;(idx.get(s.id)||[]).forEach(function(e){if(e.type==='rate'&&e.ts>m)m=e.ts;});return m;};
    list.sort(function(a,b){return last(a)-last(b)||nm(a).localeCompare(nm(b),'de');});
  }
  else list.sort(function(a,b){return nm(a).localeCompare(nm(b),'de');});
  return list;
}
function backupDue(){
  var s=state.settings,now=Date.now();
  if(state.events.length<15)return null;
  if(s.backupSnooze&&now<s.backupSnooze)return null;
  if(!s.lastBackup)return 'noch nie';
  var days=Math.floor((now-s.lastBackup)/864e5);
  return days>=7?'vor '+days+' Tagen':null;
}
function tileHTML(s,evs,c,dd,cols){
  var day=evs.filter(function(e){return e.date===dd;}).sort(function(a,b){return a.ts-b.ts;});
  var rates=day.filter(function(e){return e.type==='rate';});
  var lastR=rates[rates.length-1];
  var tc=lastR?'var(--'+byV(lastR.val).k+')':'';
  var jk=jokerInfo(evs,c.jokerEvery);
  var items=[],said=[],jN=0,jTs=0;
  var add=function(key,ts,cls,txt){var l=items[items.length-1];if(l&&l.key===key){l.n++;l.ts=ts;}else items.push({key:key,ts:ts,cls:cls,txt:txt,n:1});};
  day.forEach(function(e){
    if(e.type==='rate'){var r=byV(e.val);add('r'+e.val,e.ts,r.k,r.sym);said.push(r.sym);}
    else if(e.type==='joker'){jN+=(e.n||1);jTs=e.ts;said.push('Joker-Punkt');}
    else if(e.type==='redeem'){add('redeem',e.ts,'jk','−J');said.push('Joker eingelöst');}
    else if(e.type==='tag'){add('t'+e.tag,e.ts,'tg',e.sh||e.tn||'?');said.push(e.tn||'Marker');}
  });
  if(jN)items.push({key:'jk',ts:jTs,cls:'jk',txt:'★'+(jN>1?jN:''),n:1});
  items.sort(function(a,b){return a.ts-b.ts;});
  var max=cols===3?2:3,chips=[];
  var hidden=Math.max(0,items.length-max),vis=items.slice(hidden);
  if(hidden)chips.push('<i class="chip more">+'+hidden+'</i>');
  vis.forEach(function(it,i){chips.push('<i class="chip '+it.cls+(i===vis.length-1?' nw':'')+'">'+esc(it.txt)+(it.n>1?'×'+it.n:'')+'</i>');});
  var label=fullName(s)+(said.length?', heute: '+said.join(', '):'')+', Joker-Punkte '+jk.prog+' von '+c.jokerEvery+(jk.avail?', '+jk.avail+' Joker verfügbar':'');
  return '<button class="tile'+(ui.sel.indexOf(s.id)>=0?' picked':'')+(ui.flash===s.id?' flash':'')+(ui.lastSid===s.id?' last':'')+'" data-act="tile" data-sid="'+s.id+'"'+(tc?' style="--tc:'+tc+'"':'')+' title="'+esc(fullName(s))+'" aria-label="'+esc(label)+'">'+
    '<span class="frow"><span class="fn">'+esc(s.first||s.last)+'</span>'+(jk.avail?'<span class="jb" aria-hidden="true"><span class="jl">Joker </span>'+jk.avail+'</span>':'')+'</span>'+
    '<span class="ln">'+esc(s.first?s.last:'')+'&nbsp;</span>'+
    '<span class="chips">'+chips.join('')+'<span class="jst" aria-hidden="true">★ '+jk.prog+'/'+c.jokerEvery+'</span></span>'+
  '</button>';
}
function tilesHTML(c,idx,dd,cols){
  var toks=nrm(ui.filter).split(/\s+/).filter(Boolean);
  var list=sortStudents(c,idx).filter(function(s){
    if(!toks.length)return true;
    var w=nrm(s.first+' '+s.last).split(/\s+/);
    return toks.every(function(t){return w.some(function(x){return x.indexOf(t)===0;});});
  });
  if(!list.length)return '<p class="muted" style="grid-column:1/-1;margin:14px 4px">Keine Treffer für „'+esc(ui.filter)+'“.</p>';
  return list.map(function(s){return tileHTML(s,idx.get(s.id)||[],c,dd,cols);}).join('');
}

    '<div class="seg" role="group" aria-label="Kacheln pro Reihe"><button data-act="cols" data-n="2" aria-pressed="'+(cols===2)+'">2</button><button data-act="cols" data-n="3" aria-pressed="'+(cols===3)+'">3</button></div></div>';

function termDefaults(){
  var t=new Date(),y=t.getFullYear(),sy=t.getMonth()>=7?y:y-1;
  return {h1f:sy+'-08-01',h1t:(sy+1)+'-01-31',h2f:(sy+1)+'-02-01',h2t:(sy+1)+'-07-31'};
}
function terms(){
  var df=termDefaults(),s=state.settings.terms||{};
  return {h1:[s.h1f||df.h1f,s.h1t||df.h1t],h2:[s.h2f||df.h2f,s.h2t||df.h2t]};
}
var fmtDay=function(s){return s?s.split('-').reverse().join('.'):'';};
function rangeBounds(r){
  var t=todayStr();r=r||ui.range;
  if(r.p==='today')return [t,t];
  if(r.p==='7')return [addDays(t,-6),t];
  if(r.p==='30')return [addDays(t,-29),t];
  if(r.p==='h1'||r.p==='h2')return terms()[r.p].slice();
  if(r.p==='all')return ['0000-00-00','9999-99-99'];
  return [r.from||'0000-00-00',r.to||'9999-99-99'];
}
function rangeLabel(r){
  r=r||ui.range;var b=rangeBounds(r),span=fmtDay(b[0])+' – '+fmtDay(b[1]);
  if(r.p==='today')return 'Heute ('+fmtDay(b[0])+')';
  if(r.p==='7')return 'Letzte 7 Tage ('+span+')';
  if(r.p==='30')return 'Letzte 30 Tage ('+span+')';
  if(r.p==='h1')return '1. Halbjahr ('+span+')';
  if(r.p==='h2')return '2. Halbjahr ('+span+')';
  if(r.p==='all')return 'Gesamter Zeitraum';
  return (r.from||r.to)?(r.from?'ab '+fmtDay(r.from):'')+(r.from&&r.to?' ':'')+(r.to?'bis '+fmtDay(r.to):''):'Gesamter Zeitraum';
}
var inB=function(e,b){return e.date?(e.date>=b[0]&&e.date<=b[1]):(b[0]==='0000-00-00'&&b[1]==='9999-99-99');};
function rangeChipsHTML(r,act,bf,bt){
  r=r||ui.range;act=act||'range';bf=bf||'rfrom';bt=bt||'rto';
  var P=r.p;
  var chip=function(p,l){return '<button data-act="'+act+'" data-p="'+p+'" aria-pressed="'+(P===p)+'">'+l+'</button>';};
  var h='<div class="rng" role="group" aria-label="Zeitraum">'+chip('today','Heute')+chip('7','7 Tage')+chip('30','30 Tage')+chip('h1','1. Halbjahr')+chip('h2','2. Halbjahr')+chip('all','Alles')+chip('custom','Zeitraum …')+'</div>';
  if(P==='custom')h+='<div class="dates"><input class="inp" type="date" data-bind="'+bf+'" value="'+esc(r.from)+'" aria-label="Von"><span>bis</span><input class="inp" type="date" data-bind="'+bt+'" value="'+esc(r.to)+'" aria-label="Bis"></div>';
  if(P==='h1'||P==='h2')h+='<p class="hint" style="margin:0 0 6px">'+fmtDay(terms()[P][0])+' – '+fmtDay(terms()[P][1])+' · unter „Mehr“ anpassbar</p>';
  return h;
}
function evalRows(c){
  var idx=idxFor(c.id),b=rangeBounds();
  return c.students.map(function(s){var evs=idx.get(s.id)||[];return {s:s,st:stats(evs,b[0],b[1]),jk:jokerInfo(evs,c.jokerEvery)};});
}
function sortRows(rows){
  var k=ui.tsort.k,dir=ui.tsort.dir;
  var G=function(r){
    if(k==='name')return (r.s.last+' '+r.s.first).toLowerCase();
    if(k==='avg')return r.st.avg;
    if(k==='n')return r.st.n;
    if(k==='jp')return r.jk.pts;
    if(k==='ja')return r.jk.avail;
    if(k.indexOf('tag:')===0)return r.st.tags[k.slice(4)]||0;
    return 0;
  };
  rows.sort(function(a,b){
    var x=G(a),y=G(b);
    if(k==='avg'){if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;}
    if(typeof x==='string')return x.localeCompare(y,'de')*dir;
    return (x-y)*dir;
  });
  return rows;
}

  var c=course();
  if(!c)return emptyHTML('Noch kein Kurs','Lege zuerst einen Kurs an.','Kurs anlegen','newCourse');

  if(isMobile()){
    html+='<div class="tbar" style="margin-bottom:6px"><label class="sel"><span>Sortieren</span><select data-bind="tsortsel" aria-label="Sortieren nach">'+

    html+='<div class="ecards">'+rows.map(function(r){
      return '<button class="ecard" data-act="detail" data-sid="'+r.s.id+'"><span class="en"><b>'+esc(r.s.first||r.s.last)+'</b><small>'+esc(r.s.first?r.s.last:'')+'</small></span>'+
        '<span class="ed">'+distBar(r)+'<small>'+r.st.n+' Bewertung'+(r.st.n===1?'':'en')+(r.jk.pts?' · ★ '+r.jk.pts:'')+'</small></span>'+

function sparkSVG(evs){
  var rs=evs.filter(function(e){return e.type==='rate';}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts;}).slice(-30);

  rs.forEach(function(e,i){
    var h=Math.abs(e.val)*14+(e.val===0?3:0),y=e.val>=0?mid-h:mid;

/* ───────── Alte Daten einfügen ───────── */
var impNorm=function(s){return String(s||'').normalize('NFC').toLowerCase().replace(/[.,;:]+/g,' ').replace(/\s+/g,' ').trim();};
var impKey=function(s){return impNorm(s).split(' ').filter(Boolean).sort().join(' ');};
var NUMCELL=/^(\d+|[-−–—]?)$/;
var SUMCOLS=['++','+','o','-','--','j'];
var MAXN=500;

/* Datum in einer Zeile finden: 31.12.2026, 31.12.26, 31.12. (Jahr ergänzt) oder 2026-12-31 */
function findDate(line,defDate){
  var m=/(^|[^\d.])(\d{4})-(\d{1,2})-(\d{1,2})(?!\d)/.exec(line),y,mo,d,rest,bad=false;
  if(m){y=+m[2];mo=+m[3];d=+m[4];rest=line.replace(m[0],m[1]+' ');}
  else{
    m=/(^|[^\d.])(\d{1,2})\.\s?(\d{1,2})\.(\d{4}|\d{2})?(?!\d)/.exec(line);
    if(!m)return null;
    mo=+m[3];d=+m[2];
    rest=line.replace(m[0],m[1]+' ');
    if(m[4])y=m[4].length===2?2000+(+m[4]):+m[4];
    else{
      y=+(defDate||todayStr()).slice(0,4);
      if(ymd(new Date(y,mo-1,d))>todayStr())y--;
    }
  }
  var t=new Date(y,mo-1,d);
  if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return {bad:true};
  return {date:ymd(t),rest:rest.replace(/\s{2,}/g,' ').trim()};
}
/* Wörter mit Leerzeichen zu einem Token zusammenfassen */
function impPrep(str,tags){
  var s=' '+str.replace(/[−–—]/g,'-')+' ';
  s=s.replace(/(\s)sehr\s+gut(?=\s|$)/gi,'$1++').replace(/(\s)sehr\s+schwach(?=\s|$)/gi,'$1--')
     .replace(/(\s)joker\s+eingel(?:ö|oe)st(?=\s|$)/gi,'$1-J').replace(/(\s)joker[\s-]*punkte?(?=\s|$)/gi,'$1J');
  tags.slice().sort(function(a,b){return b.name.length-a.name.length;}).forEach(function(t){
    if(!t.name||!/\s/.test(t.name))return;
    s=s.replace(new RegExp('(\\s)'+t.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'(?=\\s|$)','gi'),'$1tag:'+t.id);
  });
  return s.trim();
}
function baseTok(low,tags){
  var m;
  if(low==='++'||low==='sehr gut')return {type:'rate',val:2};
  if(low==='+'||low==='gut')return {type:'rate',val:1};
  if(low==='o'||low==='○'||low==='0'||low==='='||low==='mittel')return {type:'rate',val:0};
  if(low==='-'||low==='schwach')return {type:'rate',val:-1};
  if(low==='--'||low==='sehr schwach')return {type:'rate',val:-2};
  if(/^[1-5]$/.test(low))return {type:'rate',val:3-(+low)};
  if(/^(j|jp|★|☆|\*|joker|jokerpunkte?)$/.test(low))return {type:'joker'};
  if(/^(-j|jokereingel(ö|oe)st|eingel(ö|oe)st)$/.test(low))return {type:'redeem'};
  if((m=/^tag:(.+)$/.exec(low))){var t0=tags.filter(function(x){return x.id.toLowerCase()===m[1];})[0];if(t0)return {type:'tag',tag:t0.id,tn:t0.name,sh:t0.short||t0.name.slice(0,3)};}
  var t=tags.filter(function(x){var n=x.name.toLowerCase(),sh=(x.short||'').toLowerCase();return low===n||(sh&&low===sh);})[0];
  if(t)return {type:'tag',tag:t.id,tn:t.name,sh:t.short||t.name.slice(0,3)};
  return null;
}
/* „3x+“, „2×★“ oder „+x3“ = mehrfach */
function valTok(tok,tags){
  var t=tok.trim(),n=1,m=/^(\d{1,3})\s*[x×]\s*(.+)$/i.exec(t);
  if(m){n=+m[1];t=m[2];}
  else if((m=/^(.+?)\s*[x×]\s*(\d{1,3})$/i.exec(t))){n=+m[2];t=m[1];}
  var b=baseTok(t.toLowerCase(),tags);
  if(!b)return null;
  b.n=n;return b;
}
function colKind(cell,tags){
  var c=impPrep(cell,tags),low=c.toLowerCase();
  if(/^(name|vorname|nachname|sch(ü|ue)ler(:?in)?|sch(ü|ue)ler\/?in(nen)?)$/.test(low))return 'name';
  if(/^(\d+)$/.test(low))return null;
  var b=baseTok(low,tags);
  return b;
}
/* Name → vorhandene Schüler:in (Reihenfolge von Vor- und Nachname egal) oder neu */
function makeResolver(c,create){
  var byKey={},byTok={},added=[],addedKey={};
  c.students.forEach(function(s){
    var k=impKey(s.first+' '+s.last);(byKey[k]=byKey[k]||[]).push(s);
    [s.first,s.last].forEach(function(p){var k2=impKey(p);if(k2&&k2.indexOf(' ')<0)(byTok[k2]=byTok[k2]||[]).push(s);});
  });
  var res=function(parts){
    var raw=parts.join(' '),k=impKey(raw);
    if(!k)return {err:'Kein Name'};
    var hit=byKey[k];
    if(!hit&&k.indexOf(' ')<0)hit=byTok[k];
    if(hit&&hit.length===1)return {sid:hit[0].id};
    if(hit&&hit.length>1)return {err:'Name nicht eindeutig: '+raw};
    if(addedKey[k])return {sid:addedKey[k].id};
    if(!create)return {err:'Unbekannter Name: '+raw};
    var f,l;
    if(parts.length>1){f=parts[0];l=parts.slice(1).join(' ');}
    else if(raw.indexOf(',')>-1){var m=raw.split(',');l=m[0].trim();f=m.slice(1).join(' ').trim();}
    else{var p=raw.split(/\s+/);if(p.length===1){f=p[0];l='';}else{l=p.pop();f=p.join(' ');}}
    var s={id:uid(),first:f,last:l};
    added.push(s);addedKey[k]=s;
    return {sid:s.id};
  };
  res.added=added;
  return res;
}
/* Eine Zeile in Name-Teile und Wertungs-Tokens zerlegen */
function splitLine(line,tags){
  var fields=/[\t;]/.test(line)?line.split(/\t|;/):[line],name=[],vals=[],bad=null;
  fields.forEach(function(f){
    f=f.trim();if(!f)return;
    var tk=f.split(/\s+/),vs=tk.map(function(t){return valTok(t,tags);});
    if(vs.every(Boolean)){vals=vals.concat(vs);return;}
    var a=0,b=tk.length;
    while(b>a+1&&vs[b-1])b--;
    if(b===tk.length)while(a<b-1&&vs[a])a++;
    vals=vals.concat(vs.slice(b).filter(Boolean),vs.slice(0,a).filter(Boolean));
    name.push(tk.slice(a,b).join(' '));
  });
  return {name:name,vals:vals};
}
function pushVal(rows,sid,date,v,n){
  var ev={sid:sid,date:date,type:v.type};
  if(v.type==='rate')ev.val=v.val;
  if(v.type==='tag'){ev.tag=v.tag;ev.tn=v.tn;ev.sh=v.sh;}
  if(v.type==='joker'){ev.n=n;rows.push(ev);return;}
  for(var i=0;i<n;i++)rows.push(Object.assign({},ev));
}
function buildImport(o,c){
  var tags=state.settings.tags,defDate=o.date||'',curD=defDate,rows=[],probs=[],lines=0,rs=makeResolver(c,o.create);
  var cols=null;
  String(o.text||'').split(/\r?\n/).forEach(function(raw,ln){
    var line=raw.trim();if(!line)return;
    var bad=function(m){probs.push({ln:ln+1,t:raw.trim(),m:m});};
    var di=findDate(line,defDate),d=curD;
    if(di&&di.bad)return bad('Ungültiges Datum');
    if(di){line=di.rest;d=di.date;if(!line){curD=di.date;return;}}
    line=impPrep(line,tags);
    if(o.mode==='entries'){
      var sp=splitLine(line,tags);
      if(!sp.vals.length)return bad('Keine Wertung erkannt');
      var r=rs(sp.name);if(r.err)return bad(r.err);
      lines++;
      sp.vals.forEach(function(v){
        if(v.n>MAXN)return bad('Zu viele Wiederholungen');
        pushVal(rows,r.sid,d,v,v.n);
      });
      return;
    }
    /* Summen: Kopfzeile (optional), danach Name + Zahlen */
    var cells=/[\t;]/.test(line)?line.split(/\t|;/).map(function(x){return x.trim();}):line.split(/\s+/);
    var kinds=cells.map(function(x){return colKind(x,tags);});
    var named=kinds.filter(function(k){return k&&k!=='name';});
    if(!cols&&named.length>=2&&!cells.some(function(x){return /^\d+$/.test(x);})){
      cols=kinds.filter(function(k){return k!=='name';});
      return;
    }
    var i=0,nm=[];
    while(i<cells.length&&!NUMCELL.test(cells[i])){nm.push(cells[i]);i++;}
    var nums=cells.slice(i);
    if(!nm.length)return bad('Kein Name');
    if(!nums.some(function(x){return /^\d+$/.test(x);}))return bad('Keine Zahlen erkannt');
    var colList=cols||SUMCOLS.map(function(k){return baseTok(k,tags);}).concat(tags.map(function(t){return baseTok('tag:'+t.id,tags);}));
    if(nums.length>colList.length)return bad('Mehr Zahlen als Spalten ('+colList.length+')');
    var r2=rs(nm.length>1&&!/[\t;]/.test(line)?[nm.join(' ')]:nm);if(r2.err)return bad(r2.err);
    var ok=true;
    nums.forEach(function(x,j){
      var n=/^\d+$/.test(x)?+x:0;
      if(!n)return;
      if(n>MAXN){ok=false;return bad('Zahl zu groß: '+x);}
      if(colList[j])pushVal(rows,r2.sid,d,colList[j],n);
    });
    if(ok)lines++;
  });
  return {rows:rows,added:rs.added,probs:probs,lines:lines};
}

  return {html:html,n:n};

function ntCols(){

function courseSave(){
  var d=ui.draft,isNew=ui.view.isNew;
  d.name=String(d.name||'').trim();
  if(!d.name){toast('Bitte einen Kursnamen eingeben.');var n=$('#cName');if(n)n.focus();return;}
  d.students=d.students.map(function(s){return {id:s.id,first:String(s.first||'').trim(),last:String(s.last||'').trim()};}).filter(function(s){return s.first||s.last;});
  d.jokerEvery=Math.max(1,Math.min(99,parseInt(d.jokerEvery,10)||5));
  if(isNew){
    state.courses.push(d);state.settings.activeCourse=d.id;ui.tab='class';
  }else{
    var i=state.courses.findIndex(function(c){return c.id===d.id;});
    if(i<0)return;
    var keep=new Set(d.students.map(function(s){return s.id;}));
    var removed=state.courses[i].students.filter(function(s){return !keep.has(s.id);});
    var cnt=state.events.filter(function(e){return e.cid===d.id&&!keep.has(e.sid);}).length;
    if(removed.length&&cnt&&!confirm(removed.length+' Schüler:in(nen) entfernen? Alle zugehörigen Einträge ('+cnt+') werden dabei gelöscht.'))return;
    state.events=state.events.filter(function(e){return e.cid!==d.id||keep.has(e.sid);});
    d.pickDone=(d.pickDone||[]).filter(function(id){return keep.has(id);});
    state.courses[i]=d;
    if(d.archived&&state.settings.activeCourse===d.id)state.settings.activeCourse=null;
  }
  save();ui.view=null;ui.draft=null;renderView();render();toast('Kurs gespeichert');

function csvCell(v){v=v==null?'':String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(rows){return '﻿'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\r\n');}
var slug=function(s){return String(s).replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,'_').replace(/^_+|_+$/g,'')||'Kurs';};
function saveFile(name,mime,text){
  var blob=new Blob([text],{type:mime});
  if(NATIVE)return nativeShare(blob,name);
  try{
    var file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:name}).then(function(){return true;},function(e){if(e&&e.name==='AbortError')return false;return dl();});
    }
  }catch(e){}
  return Promise.resolve(dl());
  function dl(){
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    return true;
  }
}
function exportEval(){
  var c=course();if(!c)return;
  var tags=state.settings.tags,rows=sortRows(evalRows(c));
  var b=rangeBounds();
  var head=['Nachname','Vorname','Ø Tendenz (1–5)','Bewertungen','sehr gut','gut','mittel','schwach','sehr schwach','Joker-Punkte gesamt','Joker verfügbar','Joker eingelöst'].concat(tags.map(function(t){return t.name;}));
  var data=[head].concat(rows.map(function(r){
    return [r.s.last,r.s.first,r.st.avg==null?'':fmtNum(r.st.avg,2),r.st.n].concat(r.st.dist,[r.jk.pts,r.jk.avail,r.jk.red],tags.map(function(t){return r.st.tags[t.id]||0;}));
  }));
  saveFile('Mitarbeit_'+slug(c.name)+'_'+todayStr()+'.csv','text/csv;charset=utf-8',toCSV(data));
}
function exportLog(){
  var c=course();if(!c)return;
  var b=rangeBounds(),names={};c.students.forEach(function(s){names[s.id]=s;});
  var evs=state.events.filter(function(e){return e.cid===c.id&&(e.date?(e.date>=b[0]&&e.date<=b[1]):(b[0]==='0000-00-00'&&b[1]==='9999-99-99'))&&names[e.sid];}).sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:x.ts-y.ts;});
  var rows=[['Datum','Uhrzeit','Nachname','Vorname','Art','Wert','Note-Äquivalent','Grund / Notiz']];
  evs.forEach(function(e){
    var s=names[e.sid],dt=e.date.split('-').reverse().join('.'),tm=e.bd?'':p2(new Date(e.ts).getHours())+':'+p2(new Date(e.ts).getMinutes());
    var art='',val='',eq='',txt='';
    if(e.type==='rate'){var r=byV(e.val);art='Mitarbeit';val=r.name;eq=3-e.val;}
    else if(e.type==='joker'){art='Joker-Punkt';val=e.n||1;txt=e.reason||'';}
    else if(e.type==='redeem')art='Joker eingelöst';
    else if(e.type==='tag')art=e.tn||'Marker';
    else if(e.type==='note'){art='Notiz';txt=e.note||'';}
    else art=e.type;
    rows.push([dt,tm,s.last,s.first,art,val,eq,txt]);
  });
  saveFile('Mitarbeit_Protokoll_'+slug(c.name)+'_'+todayStr()+'.csv','text/csv;charset=utf-8',toCSV(rows));
}
function backupNow(){
  var name='Mitarbeit_Sicherung_'+todayStr()+'.json';
  Promise.resolve(saveFile(name,'application/json',JSON.stringify(state,null,1))).then(function(ok){
    if(ok===false)return;
    state.settings.lastBackup=Date.now();save();render();toast('Sicherung gespeichert');

function importBackup(file){

  r.onload=function(){

      if(!s||!Array.isArray(s.courses)||!Array.isArray(s.events))throw new Error('format');
      if(!confirm('Sicherung mit '+s.courses.length+' Kurs(en) und '+s.events.length+' Einträgen laden? Die aktuellen Daten auf diesem Gerät werden ersetzt.'))return;
      state=normalize(s);save();ui.view=null;ui.draft=null;ui.pick=null;ui.stamp=null;renderView();render();toast('Sicherung geladen');

}

  var txt=(e.clipboardData||window.clipboardData).getData('text');
  if(/[\n,;]/.test(txt)){e.preventDefault();ui.cq[t.dataset.ctx]=txt;comboCommit(t.dataset.ctx);}
});
document.addEventListener('toggle',function(e){var t=e.target;if(t.dataset&&t.dataset.dk)ui.dopen[t.dataset.dk]=t.open;},true);
document.addEventListener('keydown',function(e){
  if(e.target.classList&&e.target.classList.contains('cin')){comboKey(e,e.target);return;}
  if(e.key==='Escape'){if(ui.sheet)closeSheet();else if(ui.view){if(['course','import','nachtrag','pdf'].indexOf(ui.view.type)<0)closeView();}else if(ui.sel.length)selClear('class');else if(ui.stamp)A.stampOff();return;}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&ui.tab==='class'&&!ui.sheet&&!ui.view&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'')&&dockVisible()){
    var kk={'1':'r2','2':'r1','3':'r0','4':'rm1','5':'rm2',j:'joker'}[e.key.toLowerCase()];
    if(e.key==='/'){var ci=$('.cin[data-ctx="class"]');if(ci&&ci.offsetParent){e.preventDefault();ci.focus();}}
    else if(kk){e.preventDefault();A.stamp({dataset:{k:kk}});}
    else if(e.key.toLowerCase()==='z'){e.preventDefault();startPick();}
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('i[data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.classList&&el.classList.contains('cin')){var cx=el.dataset.ctx;ui.cq[cx]=el.value;ui.ch[cx]=0;ui.copen[cx]=true;comboRender(cx);return;}
  var b=el.dataset&&el.dataset.bind;if(!b)return;
  if(b==='filter'){ui.filter=el.value;refreshGrid();return;}
  if(b==='cname')ui.draft.name=el.value;
  else if(b==='csubj')ui.draft.subject=el.value;
  else if(b==='every')ui.draft.jokerEvery=el.value;
  else if(b==='sfirst')ui.draft.students[+el.dataset.i].first=el.value;
  else if(b==='slast')ui.draft.students[+el.dataset.i].last=el.value;
  else if(b==='impText'){ui.imp.text=el.value;updateImportPreview();}
});
document.addEventListener('change',function(e){
  var el=e.target,b=el.dataset&&el.dataset.bind;
  if(el.id==='fileIn'){if(el.files&&el.files[0])importBackup(el.files[0]);el.value='';return;}
  if(!b)return;
  if(b==='date'){if(!el.value)return;ui.selDate=el.value===todayStr()?null:el.value;closeSheet();afterChange();}
  else if(b==='filter'){}
  else if(b==='sort'){state.settings.sort=el.value;save();renderMain();}
  else if(b==='evdate')setEventDate(el.dataset.id,el.value);
  else if(b==='pdfCourse'){ui.pdf.cid=el.value;ui.pdf.sel=[];pdfRevoke();renderView();}
  else if(b==='pdfOpt'){ui.pdf.opt[el.dataset.k]=el.checked?1:0;pdfInvalidate();}
  else if(b==='pdfGroup'){ui.pdf.group=el.checked?1:0;pdfInvalidate();}
  else if(b==='pdfSel'){var ps=ui.pdf.sel,pi=ps.indexOf(el.dataset.sid);if(el.checked&&pi<0)ps.push(el.dataset.sid);else if(!el.checked&&pi>=0)ps.splice(pi,1);var pc=$('#pdfCount');if(pc)pc.textContent='('+ps.length+' von '+pdfStudents().length+')';pdfInvalidate();}
  else if(b==='pdfFrom'||b==='pdfTo'){ui.pdf.range[b==='pdfFrom'?'from':'to']=el.value;var pt=$('#pdfRangeTxt');if(pt)pt.textContent=rangeLabel(ui.pdf.range);pdfInvalidate();}
  else if(b==='ntDate')ui.nt.date=el.value||'';
  else if(b==='ntCur'){ui.nt.cur=el.value;renderView();updateNt();}
  else if(b==='ntCourse'){ui.nt.cid=el.value;ui.nt.counts={};ui.nt.sel=[];renderView();updateNt();comboRender('nt');}
  else if(b==='impCourse'){ui.imp.cid=el.value;updateImportPreview();}
  else if(b==='impDate'){ui.imp.date=el.value||'';updateImportPreview();}
  else if(b==='impCreate'){ui.imp.create=el.checked;updateImportPreview();}
  else if(b==='stampReason'){ui.stampReason=el.value;}
  else if(b==='closeAfter'){state.settings.closeAfter=el.checked;save();}
  else if(b==='haptics'){state.settings.haptics=el.checked;save();buzz(30);}
  else if(b==='wake'){state.settings.wake=el.checked;save();wakeSync();}
  else if(b==='reason'){state.settings.jokerReasons[+el.dataset.i]=el.value.trim();save();renderDock();}
  else if(b==='tagname'){var t=state.settings.tags[+el.dataset.i];if(t){t.name=el.value.trim();if(!t.short)t.short=t.name.slice(0,3);save();renderDock();}}
  else if(b==='tagshort'){var t2=state.settings.tags[+el.dataset.i];if(t2){t2.short=el.value.trim();save();}}
  else if(b==='rfrom'){ui.range.from=el.value;afterChange();}
  else if(b==='rto'){ui.range.to=el.value;afterChange();}
  else if(b==='term'){var tm=state.settings.terms=state.settings.terms||{};tm[el.dataset.k]=el.value;save();renderMain();}
  else if(b==='tsortsel'){ui.tsort.k=el.value;ui.tsort.dir=(el.value==='name')?1:-1;renderMain();}
});
document.addEventListener('visibilitychange',function(){wakeSync();if(!document.hidden){checkUpdate();if(!ui.view&&!ui.sheet)render();}});
window.addEventListener('resize',function(){if(dockVisible())document.documentElement.style.setProperty('--dockh',$('#dock').offsetHeight+'px');});

/* Handy: Kopf- und Stempelleiste fahren beim Hinunterscrollen ein und beim Hinaufscrollen wieder aus */
var lastY=0,scrollTick=false;
function showBars(){document.body.classList.remove('hide-hdr','hide-dock');}
function hideBars(){
  document.body.classList.add('hide-hdr');
  if(!ui.stamp&&!ui.sel.length)document.body.classList.add('hide-dock');
}
window.addEventListener('scroll',function(){
  if(scrollTick)return;scrollTick=true;
  requestAnimationFrame(function(){
    scrollTick=false;
    if(ui.sheet||ui.view)return;
    if(!window.matchMedia('(max-width:699px)').matches){showBars();return;}
    var y=window.pageYOffset,dy=y-lastY,max=document.documentElement.scrollHeight-window.innerHeight;
    if(y<=10||y>=max-4||dy<-6)showBars();
    else if(dy>6&&y>50)hideBars();
    if(Math.abs(dy)>3)lastY=y;
  });
},{passive:true});

/* ───────── Updates: Versionsprüfung und Ziehen zum Aktualisieren ───────── */
var lastChk=0;
var appVer=function(t){var m=/<meta name="app-version" content="([^"]*)"/.exec(t);return m?m[1]:null;};
var myVer=(document.querySelector('meta[name="app-version"]')||{}).content||null;
function checkUpdate(manual){
  var now=Date.now();
  if(!manual&&now-lastChk<5*60000)return Promise.resolve(false);
  lastChk=now;
  if(NATIVE||!/^https?:$/.test(location.protocol))return Promise.resolve(false);
  if('serviceWorker' in navigator)navigator.serviceWorker.getRegistration().then(function(r){return r&&r.update();}).catch(function(){});
  return fetch('index.html',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http');return r.text();}).then(function(t){
    var v=appVer(t);
    if(v&&myVer&&v!==myVer){toast('Neue Version verfügbar',function(){location.reload();},false,'Neu laden',30000);return true;}
    return false;
  }).catch(function(){return null;});
}
(function(){
  var startY=null,startX=0,pull=0,busy=false,TH=72,ind=null;
  var el=function(){if(!ind){ind=document.createElement('div');ind.id='ptr';ind.setAttribute('aria-hidden','true');ind.innerHTML='<i></i>';document.body.appendChild(ind);}return ind;};
  var reset=function(){startY=null;pull=0;if(ind&&!busy){ind.classList.remove('on','ready');ind.style.transform='';}};
  document.addEventListener('touchstart',function(e){
    if(NATIVE||busy||e.touches.length!==1||ui.sheet||ui.view||window.pageYOffset>0)return;
    if(e.target.closest&&e.target.closest('input,textarea,select,.rng,.tw,.ntw,.xrow,.pdflist,#dock,#sheetWrap'))return;
    startY=e.touches[0].clientY;startX=e.touches[0].clientX;pull=0;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(startY==null)return;
    var dy=e.touches[0].clientY-startY,dx=Math.abs(e.touches[0].clientX-startX);
    if(dy<=0||window.pageYOffset>0||dx>dy){reset();return;}
    pull=Math.min(dy*0.5,110);
    if(pull>6){var n=el();n.classList.add('on');n.classList.toggle('ready',pull>=TH);n.style.transform='translate(-50%,'+(pull-34)+'px) rotate('+(pull*3)+'deg)';}
  },{passive:true});
  var end=function(){
    if(startY==null)return;
    if(pull>=TH){
      busy=true;var n=el();n.classList.add('on','spin');n.style.transform='translate(-50%,'+(TH-34)+'px)';buzz(15);
      checkUpdate(true).then(function(newer){
        if(newer)return;
        render();
        toast(newer===null?'Keine Verbindung – Version nicht geprüft':'Aktuell – du hast die neueste Version');
      }).then(function(){busy=false;n.classList.remove('on','spin','ready');n.style.transform='';});
    }
    reset();
  };
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',reset,{passive:true});
})();

/* Zurück-Taste (Android): erst Fenster und Auswahl schließen, dann zu „Unterricht“, erst dann die App verlassen */
function handleBack(){
  if(ui.sheet){closeSheet();return true;}
  if(ui.view){
    var lose=(ui.view.type==='nachtrag'&&ui.nt&&ntTotal())||(ui.view.type==='import'&&ui.imp&&String(ui.imp.text||'').trim());
    if(lose&&!confirm('Eingaben verwerfen?'))return true;
    closeView();return true;
  }
  if(ui.sel.length){selClear('class');return true;}
  if(ui.stamp){A.stampOff();return true;}
  if(ui.tab!=='class'){ui.tab='class';showBars();render();window.scrollTo(0,0);return true;}
  return false;
}
try{history.replaceState({m:0},'');history.pushState({m:1},'');}catch(e){}
window.addEventListener('popstate',function(e){
  if(!e.state||e.state.m!==0)return;
  if(handleBack()){try{history.pushState({m:1},'');}catch(x){}}
  else history.back();
});
/* Android-App: Zurück-Taste über das App-Plugin (sonst würde die WebView-Historie zurückgehen) */
if(plug('App'))plug('App').addListener('backButton',function(){if(!handleBack())plug('App').exitApp();});
/* Installation als App */
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;if(ui.tab==='more'||ui.tab==='class')renderMain();});
window.addEventListener('appinstalled',function(){installEvt=null;toast('App installiert');render();});
/* Kurzbefehle vom App-Symbol (?a=nachtragen | zufall) */
(function(){
  var a=(new URLSearchParams(location.search)).get('a');
  if(!a)return;
  try{history.replaceState({m:1},'',location.pathname);}catch(e){}
  if(a==='nachtragen')openNachtrag();else if(a==='zufall'&&dockVisible())startPick();
})();
wakeSync();
setTimeout(checkUpdate,4000);
snapRestoreIfLost();
if(hadRaw)snapNow();

mqMobile.addEventListener('change',function(){
  render();
  if(ui.view&&ui.view.type==='nachtrag'){renderView();updateNt();comboRender('nt');}
  else if(ui.view&&ui.view.type==='student')renderView();
});
render();
if(!NATIVE&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  var hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(hadCtl)toast('Neue Version geladen',function(){location.reload();},false,'Neu laden',20000);
    hadCtl=true;
  });
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
})();
