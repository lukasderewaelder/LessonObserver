<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LessonObserver">
<meta name="format-detection" content="telephone=no">
<meta name="app-version" content="2026-10-31.2">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>LessonObserver</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F5F5F3; --ink:#1B1B1A; --muted:#6A6A66; --line:#E6E6E3; --line2:#CFCFCB;
  --r2:#2E7D5A; --r1:#5E8E4B; --r0:#7B7F86; --rm1:#B8702C; --rm2:#B3463C; --on-r:#FFFFFF;
  --danger:#B3261E; --joker:#A87400; --joker-soft:#FFF3CC;
  --fs-xs:11px; --fs-s:12px; --fs-m:14px; --fs-l:16px; --fs-xl:20px; --fs-in:14px;
  --cc:#6A6A66; --wrap:1100px; --navh:calc(56px + env(safe-area-inset-bottom)); --dockh:0px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121212;--surface:#181818;--surface2:#1F1F1E;--ink:#ECECEA;--muted:#9C9C97;--line:#2A2A28;--line2:#3D3D3A;
        --r2:#4FAE85;--r1:#86B873;--r0:#9A9EA5;--rm1:#D9954F;--rm2:#D9695E;--on-r:#121212;--danger:#F2766E;--joker:#E6B43E;--joker-soft:#3A2F09}
}
.r2{--c:var(--r2)} .r1{--c:var(--r1)} .r0{--c:var(--r0)} .rm1{--c:var(--rm1)} .rm2{--c:var(--rm2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-weight:400}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior-y:contain}
.view,.sheet{overscroll-behavior:contain}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs-m)/1.4 var(--ui);-webkit-font-smoothing:antialiased;touch-action:manipulation}
body.overlay{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.ic{width:20px;height:20px;flex:0 0 auto}.ic.sm{width:14px;height:14px}

/* Bausteine: Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:var(--fs-m);text-align:center}
.btn:active{background:var(--surface2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:active{opacity:.85}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.text{border-color:transparent;background:none;padding:0 12px}
.btn.sm{min-height:40px;padding:0 14px;font-size:var(--fs-m)}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:var(--fs-l)}
.btn:disabled{opacity:.4}
.btn.text:active{background:var(--surface2)}
.linkbtn,.navb{min-height:44px;padding:0 12px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.iconbtn,.ico{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:0 0 auto;border-radius:12px;color:var(--muted);font-size:var(--fs-l)}
.ico{border:1px solid var(--line2);background:var(--surface)}
.iconbtn:active,.ico:active{background:var(--surface2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.btn.grow{flex:1}

/* Bausteine: Formulare */
select,.inp,textarea,input{font-family:var(--ui)}
select,.inp,textarea{font:inherit;font-size:var(--fs-in);color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:0 14px;min-height:48px;min-width:0}
textarea{width:100%;resize:vertical;min-height:88px;padding:12px 14px;line-height:1.4}
select{padding-right:10px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld>span{font-size:var(--fs-s);color:var(--muted)}
.fld small,.hint{color:var(--muted);font-size:var(--fs-s)}
.hint{margin:0 0 8px;line-height:1.45}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-width:44px;min-height:40px;padding:0 12px;border-radius:9px;color:var(--muted);font-size:var(--fs-m);line-height:1.2}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:0 0 auto;transition:background .15s;margin:0}
input[type=checkbox].sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--bg);transition:transform .15s}
input[type=checkbox].sw:checked{background:var(--ink)}
input[type=checkbox].sw:checked::after{transform:translateX(20px)}
@media (prefers-reduced-motion:reduce){input[type=checkbox].sw,input[type=checkbox].sw::after{transition:none}}
code{font:inherit;background:var(--surface2);padding:0 4px;border-radius:4px}

/* Bausteine: Listen */
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:24px}
.lrow,.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 16px;width:100%;text-align:left;background:var(--surface)}
.lrow:active{background:var(--surface2)}
.lrow+.lrow,.list>.setrow+.setrow,.list>*+*{border-top:1px solid var(--line)}
.lt{min-width:0;overflow-wrap:break-word}
.lt small,.setrow small{display:block;color:var(--muted);font-size:var(--fs-s);margin-top:2px}
.setrow{border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.list .setrow{border:0;border-radius:0;margin:0}
.lrow .ic{color:var(--muted)}
.lrow.split{padding:0 12px 0 0;cursor:default}
.lrow.split:active{background:var(--surface)}
.lrow .go{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:56px;padding:12px 0 12px 16px;text-align:left}
.lrow .go .ic{margin-left:auto}
.seat .name{align-items:center;text-align:center}
.cdot{width:10px;height:10px;border-radius:50%;background:var(--k,var(--cc));flex:0 0 auto}
.sect{margin-bottom:24px}
.sect>h3,.vbody h3,.sec>h3{font-size:var(--fs-s);color:var(--muted);margin:0 0 8px}
.vbody h3{margin-top:24px}
.ptitle{font-size:var(--fs-xl);line-height:1.25;margin:4px 0 16px}
.subhead{display:flex;align-items:center;margin:-8px 0 4px -12px}
.empty{text-align:center;padding:56px 20px}
.empty h2{font-size:var(--fs-xl);line-height:1.25;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 0 24px}
.danger-zone{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
details.box{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 16px;margin-top:16px}
details.box summary{min-height:52px;display:flex;align-items:center;cursor:pointer}
details.box[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.box>*:last-child{margin-bottom:16px}

/* Kopf */
#hdr{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:1px solid var(--line);transition:transform .22s ease}
.hin{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:var(--wrap);margin:0 auto}
.cbtn{display:flex;align-items:center;gap:10px;min-width:0;min-height:44px;text-align:left}
.cbtn .ctx{display:flex;flex-direction:column;min-width:0}
.ct{font-size:var(--fs-l);line-height:1.25;overflow-wrap:break-word}
.cs{font-size:var(--fs-s);color:var(--muted)}
.cbtn .ic{color:var(--muted)}
.datechip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-size:var(--fs-m);white-space:nowrap;flex:0 0 auto}
.datechip.alt{border-color:var(--ink);background:var(--surface2)}
.hright{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.hright .datechip{margin-left:6px}
.hbtn{width:40px;height:44px}
.hbtn:disabled{opacity:.3}#main{padding:16px 16px calc(var(--navh) + var(--dockh) + 24px);max-width:var(--wrap);margin:0 auto}
body.nodock #main{padding-bottom:calc(var(--navh) + 24px)}

/* Navigation unten */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:16;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navtab{position:relative;flex:1;max-width:220px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:var(--fs-s);color:var(--muted)}
.navtab[aria-selected=true]{color:var(--ink)}
.navtab[aria-selected=true]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--ink);border-radius:0 0 2px 2px}
body.overlay #nav{z-index:5}

/* Werkzeugleiste */
.fbar{display:flex;gap:8px;margin:0 0 12px}
.fsearch{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:0 14px;min-height:48px;color:var(--muted)}
.fsearch:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.fsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:var(--fs-in);color:var(--ink);padding:10px 0}
.sortbtn{width:48px;min-height:48px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tbar.deskbar{display:none}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.tbar .btn{min-height:44px;padding:0 16px}
.sel{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);color:var(--muted);flex:1;min-width:0}
.sel select{flex:1;min-width:0;width:100%}
.fo{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-m);cursor:pointer;white-space:nowrap}
.planbar{justify-content:flex-start}
.phint{font-size:var(--fs-s);flex:1 1 180px}
.planbar .deskonly{display:none}
.planfab{display:none}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line2);background:var(--surface2);border-radius:12px;font-size:var(--fs-m);line-height:1.4}
.banner>span{flex:1 1 220px}
.banner.warn{border-color:var(--danger)}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}

/* Kacheln */
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px;--tmin:200px}
.grid.c3{--tmin:160px}
.tile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:76px;padding:12px;text-align:left;background:var(--surface);border:1px solid var(--line2);border-radius:12px}
.tile::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--tc,transparent)}
.tile:active{background:var(--surface2)}
.tile.last{border-color:var(--ink)}
.tile.picked,.tile.mv{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface2)}
.fn{display:block;font-size:var(--fs-l);line-height:1.25;white-space:normal;overflow-wrap:break-word;hyphens:auto;min-width:0}
.frow{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;min-width:0}
.ln{display:block;font-size:var(--fs-m);line-height:1.25;color:var(--muted);overflow-wrap:break-word;hyphens:auto;min-width:0}
.name{display:flex;flex-direction:column;gap:2px;min-width:0}
.chips{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-height:22px;margin-top:auto}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:6px;border:1px solid var(--c,var(--line2));color:var(--c,var(--muted));font-style:normal;font-size:var(--fs-s);line-height:1;white-space:nowrap}
.chip.jk{border-color:var(--joker);color:var(--joker);background:var(--joker-soft)}
.chip.tg,.chip.st{border-color:var(--line2);color:var(--muted)}
.chip.more{border-color:transparent;color:var(--muted);min-width:0;padding:0 2px}
.jb{flex:0 0 auto;font-size:var(--fs-s);line-height:1;padding:3px 6px;border-radius:6px;border:1px solid var(--joker);color:var(--joker);background:var(--joker-soft);white-space:nowrap}
.jst{margin-left:auto;flex:0 0 auto;font-size:var(--fs-s);color:var(--joker);white-space:nowrap}
@keyframes stamp{0%{transform:scale(1)}35%{transform:scale(.95)}100%{transform:scale(1)}}
.tile.flash{animation:stamp .25s ease-out}
@media (prefers-reduced-motion:reduce){.tile.flash{animation:none}}
@media (hover:hover){.tile:hover{border-color:var(--ink)}}
.grid.c3 .tile{padding:10px}
.grid.c3 .fn{font-size:var(--fs-m)}
.grid.c3 .ln{font-size:var(--fs-s)}
.grid.c3 .jb{display:none}

/* Sitzplan */
.pscroll{overflow-x:auto;padding-bottom:4px}
.pgrid{display:grid;grid-template-rows:repeat(var(--nr),1fr) auto;gap:12px;min-width:calc(var(--nc)*52px);container-type:inline-size;--seat-h:clamp(56px,calc(100cqi/var(--nc)*.56),100px)}
.prow{display:grid;grid-template-columns:repeat(var(--nd),minmax(0,1fr));gap:clamp(8px,2.2cqi,22px);min-height:var(--seat-h)}
.desk{position:relative;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.slot{min-width:0;border-radius:8px;display:flex;flex-direction:column}
.slot>span,.poolgrid>span{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
.slot.empty{border:1px dashed var(--line2);background:var(--surface);min-height:48px;padding:0;text-align:left}
.dim{opacity:.3}
.board{margin-top:4px;text-align:center;font-size:var(--fs-s);letter-spacing:.2em;text-transform:uppercase;padding:10px;border-radius:12px;background:var(--ink);color:var(--bg)}
.tile.seat{padding:6px 4px;min-height:48px;gap:2px;border-radius:8px;flex:1 1 auto;min-width:0;justify-content:center;align-items:center;text-align:center}
.tile.seat::before{display:none}
.pgrid .seat .fn,.poolgrid .seat .fn{font-size:clamp(11px,calc(100cqi/var(--nc)*.15),17px)}
.poolgrid .seat .fn{font-size:14px}
.seat .frow{justify-content:center;max-width:100%}
.seat .jb{position:absolute;top:-7px;right:-3px;font-size:10px;padding:2px 4px;background:var(--joker-soft)}.seat .jl{display:none}
.seat .chips{min-height:16px;margin-top:0;justify-content:center}.seat .chips:empty{display:none}
.seat .chip{height:16px;min-width:16px;padding:0 3px;font-size:10px}
.pool{margin-top:16px;padding:12px;border-radius:12px;border:1px dashed var(--line2)}
.pool h3{margin:0 0 8px;font-size:var(--fs-m);color:var(--muted)}
.poolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.poolgrid .tile.seat{min-height:52px}
.plan.edit .tile.seat{touch-action:none;cursor:grab}
.plan.edit .slot.empty,.plan.edit .pool{touch-action:manipulation}
.slot.over,.pool.over{outline:2px solid var(--ink);outline-offset:1px}
.tile.dragsrc{opacity:.3}
.tile.ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.planset{display:flex;gap:12px;flex-wrap:wrap}.planset .fld{flex:1 1 140px}

/* Stempelleiste */
#dock{position:fixed;left:0;right:0;bottom:var(--navh);z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px 10px}
body.nodock #dock{display:none}
.dhint{font-size:var(--fs-s);line-height:1.3;color:var(--muted);min-height:24px;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dhint .hl{min-width:0}
.dhint .stop{flex:0 0 auto;font-size:var(--fs-m);color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:6px 4px}
.dhint b{color:var(--ink)}
.dhint select{min-height:36px;padding:0 8px;font-size:var(--fs-m);max-width:150px;flex:0 1 auto}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:560px;margin:0 auto}
.stamp{position:relative;height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:var(--fs-xl);line-height:1}
.stamp::after{content:"";position:absolute;left:30%;right:30%;bottom:7px;height:3px;border-radius:2px;background:var(--c)}
.stamp:active{background:var(--surface2)}
.stamp.on{background:var(--c);border-color:var(--c);color:var(--on-r)}
.stamp.on::after{display:none}
#dock.armed .stamp:not(.on){opacity:.55}
.xb3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;max-width:560px;margin-left:auto;margin-right:auto}
.xb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);font-size:var(--fs-m)}
.xb svg{width:18px;height:18px}
.xb:active{background:var(--surface2)}
.xb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xb.joker{border-color:var(--joker);color:var(--joker)}
.xb.joker.on{background:var(--joker);border-color:var(--joker);color:var(--on-r)}
.xrow{display:none}
.xs{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:var(--fs-m);white-space:nowrap}
.xs.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#dock.armed .xs:not(.on){opacity:.55}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + var(--dockh) + 12px);transform:translateX(-50%);z-index:70;display:none;align-items:center;gap:12px;width:max-content;max-width:min(92vw,520px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:var(--fs-m);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.show{display:flex}
#toast.gold{background:var(--joker);color:var(--on-r)}
#toast button{padding:6px 12px;min-height:36px;border-radius:8px;border:1px solid currentColor;white-space:nowrap}
body.nodock #toast{bottom:calc(var(--navh) + 12px)}
body.overlay #toast{bottom:auto;top:calc(env(safe-area-inset-top) + 12px)}
body.view-open #toast{top:auto;bottom:calc(16px + env(safe-area-inset-bottom))}

/* Sheet */
#sheetWrap{position:fixed;inset:0;z-index:40;display:none}
#sheetWrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(10,10,10,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh-head h2{font-size:var(--fs-xl);line-height:1.25;overflow-wrap:break-word;min-width:0}
.sh-head h2 span{color:var(--muted)}
.sh-head .iconbtn{margin:-6px -8px 0 0}
.sh-sub{font-size:var(--fs-s);color:var(--muted);margin-top:2px}
.sec{margin-top:20px}
.rbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;height:76px;padding:12px 2px 0;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:var(--fs-xl);line-height:1}
.rbtn::after{content:"";position:absolute;left:30%;right:30%;bottom:6px;height:3px;border-radius:2px;background:var(--c)}
.rbtn small{font-size:var(--fs-xs);line-height:1.15;color:var(--muted)}
.rbtn:active{background:var(--surface2)}
.rbtn:disabled{opacity:.4}
.snav{display:flex;align-items:center;justify-content:space-between;margin:-8px -12px 12px;font-size:var(--fs-s);color:var(--muted)}
.sstat{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:var(--fs-s);color:var(--muted);margin:16px 0 4px}
.sstat b{color:var(--ink)}
.wrap{display:flex;gap:8px;flex-wrap:wrap}
.rchip,.act{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:var(--fs-m);text-align:center}
.act:active,.rchip:active{background:var(--surface2)}
.act.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act:disabled{opacity:.4}
[data-act=sjoker]{border-color:var(--joker);color:var(--joker);background:var(--joker-soft)}
.act small{opacity:.7}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mgrid .act{min-height:52px}
.today{display:flex;gap:8px;flex-wrap:wrap;min-height:32px;align-items:center}
.tchip{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 4px 0 10px;border-radius:8px;border:1px solid var(--c,var(--line2));color:var(--c,var(--ink));font-size:var(--fs-m)}
.tchip.jk{border-color:var(--joker);color:var(--joker);background:var(--joker-soft)}
.tchip.tg,.tchip.st{border-color:var(--line2);color:var(--muted)}
.tchip i{font-style:normal;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;font-size:var(--fs-l);cursor:pointer}
details.sdet{margin-top:12px}
.clist{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.crow{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.crow.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.crow .lt{flex:1}
.crow b{font-size:var(--fs-l);display:block;line-height:1.25}
.crow small{color:var(--muted);font-size:var(--fs-s)}

/* Vollbild-Seiten */
.view{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.view.open{display:block}
.vhead{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:var(--bg);border-bottom:1px solid var(--line);min-height:56px}
.vhead h2{font-size:var(--fs-l);line-height:1.25;text-align:center;overflow-wrap:break-word;max-width:46vw}
.vhead .vl{justify-self:start}.vhead .vr{justify-self:end}
.vbody{padding:16px 16px calc(32px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.vbody.wide{max-width:1100px}
.vsec{margin-top:24px}
.vsec h3{margin-top:0!important}

/* Auswertung */
.rangebtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);text-align:left;margin-bottom:12px;font-size:var(--fs-m)}
.rangebtn .ic{color:var(--muted)}
.dates{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:var(--fs-m);color:var(--muted)}
.dates input{flex:1}
.sum,.kpis{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 16px;border:1px solid var(--line);border-radius:12px}
.kpis{grid-template-columns:repeat(2,1fr)}
.stat{padding:12px 14px}
.stat+.stat{border-left:1px solid var(--line)}
.kpis .stat:nth-child(n+3){border-top:1px solid var(--line)}
.kpis .stat:nth-child(odd){border-left:0}
.stat b{display:block;font-size:var(--fs-xl);line-height:1.2}
.stat span{font-size:var(--fs-s);color:var(--muted)}
.ecards{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
details.evlist .ecards{border:0;border-radius:0;margin-bottom:0}
.ecard{display:grid;grid-template-columns:minmax(0,1fr) 116px 44px;gap:10px;align-items:center;text-align:left;padding:12px 16px;background:var(--surface);min-height:60px;width:100%}
.ecard+.ecard{border-top:1px solid var(--line)}
.ecard:active{background:var(--surface2)}
.ecard .en b{display:block;font-size:var(--fs-l);line-height:1.25;overflow-wrap:break-word}
.ecard .en small{color:var(--muted);font-size:var(--fs-s)}
.ecard .ed{display:flex;flex-direction:column;gap:4px}
.ecard .ed small{color:var(--muted);font-size:var(--fs-s);line-height:1.3}
.ecard .ea{text-align:right}
.avg{display:inline-block;min-width:36px;padding:3px 6px;border-radius:6px;border:1px solid var(--c,var(--line2));color:var(--c,var(--ink));text-align:center;font-size:var(--fs-m)}
.dist{display:inline-flex;width:84px;height:6px;border-radius:3px;overflow:hidden;background:var(--line);vertical-align:middle}
.ecard .dist{width:100%}
.dist i{display:block;height:100%;background:var(--c)}
.none-list{display:flex;gap:8px;flex-wrap:wrap}
.none-list button{padding:8px 12px;min-height:40px;border-radius:10px;border:1px solid var(--line2);font-size:var(--fs-m)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--fs-m)}
.tbl th,.tbl td{padding:10px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:var(--fs-s);color:var(--muted);background:var(--surface2);position:sticky;top:0}
.tbl th button{color:inherit;font-size:inherit;padding:2px 0}
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;text-align:left;background:var(--surface);border-right:1px solid var(--line);z-index:1}
.tbl th:first-child{background:var(--surface2);z-index:2}
.tbl td:first-child button{text-align:left}
.tbl td:first-child small{display:block;color:var(--muted);font-size:var(--fs-s)}

/* Verlauf */
.spark{display:block;width:auto;max-width:100%;height:64px;margin:6px 0 2px}
.trend{display:block;width:100%;max-width:640px;height:auto;margin:6px 0 2px;color:var(--muted)}
.tlegend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:var(--fs-s);color:var(--muted)}
.tlegend span{display:inline-flex;align-items:center;gap:6px}
.tlegend svg{width:22px;height:8px;flex:0 0 auto}
.dh{font-size:var(--fs-s);color:var(--muted);margin:20px 0 8px}
.ev{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:52px}
.ev .chip{flex:0 0 auto;min-width:32px;height:26px}
.ev .tx{flex:1;min-width:0;font-size:var(--fs-m);overflow-wrap:break-word}
.ev .tx small{display:block;color:var(--muted);font-size:var(--fs-s)}
.ev .dt{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;color:var(--muted);border-radius:10px;cursor:pointer}
.ev .dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.ev button{width:40px;height:40px;color:var(--muted);font-size:var(--fs-l);border-radius:10px}
.drow{display:grid;grid-template-columns:36px 1fr 28px 44px;gap:10px;align-items:center;margin-bottom:8px}
.drow small{color:var(--muted);text-align:right}
.dbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--c)}
.trow{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line)}
.note{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
.note small{color:var(--muted)}

/* Heutige Bewertung */
.pickbox{text-align:center;padding:32px 8px 12px;border:2px solid transparent;border-radius:16px;transition:background .2s,border-color .2s}
.pickbox.rated{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--bg))}
.pickbox.glow{animation:jglow .9s ease-out}
@keyframes jglow{0%{box-shadow:0 0 0 0 var(--joker);background:var(--joker-soft)}100%{box-shadow:0 0 0 18px transparent}}
@media (prefers-reduced-motion:reduce){.pickbox.glow{animation:none}}
.rbtn.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.rbtn.on::after{left:20%;right:20%;height:4px}
.act.joker{border-color:var(--joker);color:var(--joker)}
.act.joker.jon{background:var(--joker-soft);box-shadow:inset 0 0 0 1px var(--joker)}
.pickbox .fnb{font:400 clamp(32px,10vw,48px)/1.1 var(--ui);overflow-wrap:break-word;hyphens:auto}
.pickbox .lnb{font:400 clamp(18px,5vw,22px)/1.2 var(--ui);color:var(--muted);margin-top:4px;min-height:34px}
.pickbox .runde{font-size:var(--fs-s);color:var(--muted);margin-top:16px}

/* Kurs-Editor, Nachtragen, Import, PDF */
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw-c{width:40px;height:40px;border-radius:50%;background:var(--k);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line2)}
.sw-c.on{box-shadow:0 0 0 2px var(--ink)}
.srow{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;margin-bottom:8px}
.listrow{display:grid;grid-template-columns:1fr 44px;gap:8px;margin-bottom:8px}
.listrow.tag{grid-template-columns:1fr 84px 44px}
.termrow{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:16px}
.termrow span{font-size:var(--fs-s);color:var(--muted)}
.termrow .tr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcards{display:grid;gap:8px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);text-align:left;min-height:60px}
.tcard small{color:var(--muted);font-size:var(--fs-s)}
.tcard[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface2)}
.pdflist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;accent-color:var(--ink)}
.rescard{padding:16px;border:1px solid var(--ink);border-radius:12px;background:var(--surface)}
.pdfprev{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;margin-top:12px;background:#fff}
.ntpick{display:grid;grid-template-columns:auto 1fr auto;gap:4px;align-items:center}
.ntpick select{width:100%;font-size:var(--fs-in)}
.ntrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);min-height:60px}
.ntrow .nl{display:flex;align-items:center;gap:12px;min-width:0}
.ntrow .nl .chip{min-width:38px;height:28px;font-size:var(--fs-m)}
.nstep{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.nstep .nb{width:48px;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:var(--fs-xl)}
.nstep .nb.pl{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nstep .nv{min-width:36px;text-align:center;font-size:var(--fs-xl)}
.nstep .nv.zero{color:var(--muted)}
.ntpend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ntpend button{min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:var(--fs-m)}
.ntpend button.cur{border-color:var(--ink);background:var(--surface2)}
.nt-ctl{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.nt-ctl .fld{margin:0}
.nt{border-collapse:separate;border-spacing:0;width:100%}
.nt th,.nt td{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.nt th{position:sticky;top:0;z-index:2;background:var(--surface2);padding:8px 2px}
.nt th:first-child,.nt td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:var(--surface);padding:3px 10px;border-right:1px solid var(--line);min-width:110px}
.nt th:first-child{z-index:3;background:var(--surface2)}
.nt td:first-child b{font-size:var(--fs-m);display:block}
.nt td:first-child small{display:block;color:var(--muted);font-size:var(--fs-s)}
.nt tr.picked td{background:var(--surface2)}
.nt tr.picked td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.ntw{overflow:auto;max-height:calc(100vh - 235px);max-height:calc(100dvh - 235px);min-height:240px;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
.nc{width:100%;min-width:36px;height:40px;border-radius:8px;color:var(--muted);font-size:var(--fs-l)}
.nc.on{background:var(--ink);color:var(--bg)}
.ntsel{display:none}
.ntap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ntap .nap{height:36px;padding:0 4px;border-radius:8px;border:1px solid var(--line2);background:var(--surface)}
.ntap .nap .chip{border:0;min-width:34px}
.kbd{display:none}
.selbar{display:none}

/* Suchfeld mit Mehrfachauswahl (PC) */
.tbar .selbar{margin:0;flex:1 1 240px;max-width:440px;min-width:0}
.planbar .selbar{margin-left:auto}
.combo{position:relative;min-width:0;flex:1}
.cbox{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:44px;padding:3px 6px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);cursor:text}
.cbox:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.cin{flex:1;min-width:130px;border:0;outline:0;background:transparent;font:inherit;font-size:var(--fs-in);color:var(--ink);padding:5px 4px}
.cdrop{margin-left:auto;width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:var(--fs-m)}
.cdrop:hover{background:var(--surface2)}
.cchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--ink);border-radius:8px;padding:2px 2px 2px 8px;font-size:var(--fs-s);white-space:nowrap}
.cchip button{width:22px;height:22px;line-height:1;border-radius:5px;color:var(--muted);font-size:var(--fs-m)}
.copts{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.2);max-height:320px;overflow:auto}
.copts li{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.copts li small{color:var(--muted)}
.copts li.hi{background:var(--ink);color:var(--bg)}
.copts li.hi small{color:var(--bg);opacity:.8}
.copts li.none{color:var(--muted);cursor:default}

/* Ziehen zum Aktualisieren */
#ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-40px);z-index:60;width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}
#ptr.on{opacity:1}
#ptr i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ink)}
#ptr.spin i{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#ptr.spin i{animation:none}}

/* Handy: Kopf fährt beim Scrollen ein */
@media (max-width:699px){
  body.hide-hdr #hdr{transform:translateY(-100%)}
}
@media (max-width:699px){
  .planbar.idle{display:none}
  .planfab{display:flex;position:fixed;right:16px;bottom:calc(var(--navh) + var(--dockh) + 12px);z-index:14;align-items:center;justify-content:center;min-height:52px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .planfab.dots{width:52px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
  .planfab.btn{padding:0 24px;border-radius:26px}
  body.overlay .planfab{z-index:5}
}
@media (max-width:699px){.plan{margin:0 -6px 64px}.desk{gap:3px;padding:3px}.tile.seat{padding:4px 1px}}
/* Tablet und größer */
@media (min-width:700px){
  .sheet{top:50%;bottom:auto;transform:translateY(-50%);border-radius:20px;max-height:88vh;animation:none;box-shadow:0 12px 48px rgba(0,0,0,.3)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(var(--tmin),1fr));grid-auto-rows:1fr}
  .vbody{max-width:720px}
  .vbody.wide{max-width:1100px}
  .tcards{grid-template-columns:repeat(3,1fr)}
  .termrow{grid-template-columns:140px 1fr;align-items:center}
  .planbar .deskonly{display:inline-flex}
  .tile.seat{padding:6px 8px}
}
@media (min-width:900px){
  #hdr{padding:calc(env(safe-area-inset-top) + 8px) 24px 8px}
  #main{padding:24px 24px calc(var(--navh) + var(--dockh) + 24px)}
  #dock{padding:10px 24px}
  .dmain{display:flex;align-items:center;gap:16px;max-width:1400px;margin:0 auto}
  .stamps{flex:0 0 400px;margin:0}
  .xb3{margin:0;min-width:340px}
  .xrow{display:flex;flex-wrap:wrap;gap:8px}
  .dhint{max-width:1400px;margin:0 auto 8px}
  .kbd{display:inline}
  .fbar{display:none}
  .tbar.deskbar{display:flex}
  .tbar .sel{max-width:260px;flex:0 1 260px}
  .tbar .seg{margin-left:auto}
  .selbar{display:block;margin:0}
  .ntsel{display:block;margin-bottom:12px}
  .fn{font-size:var(--fs-l)}
  .tile{padding:14px}
  .rbtn{height:72px}
}
@media (min-width:1400px){.grid{--tmin:230px}.grid.c3{--tmin:180px}}
@supports (-webkit-touch-callout:none){:root{--fs-in:16px}}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="main"></main>
<div id="dock"></div>
<nav id="nav" aria-label="Hauptnavigation"></nav>
<div id="view" class="view" role="dialog" aria-modal="true"></div>
<div id="sheetWrap"><div class="backdrop" data-act="close"></div><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

/* ───────── Grundlagen ───────── */
var KEY='mitarbeit-app-v1';
var PAL=['#2F5FD0','#0E7C70','#2E7D32','#B45309','#C62828','#7C3AED','#C2185B','#546378'];
var ccol=function(c){return (c&&c.color)||PAL[0];};
var RATINGS=[
  {k:'r2', v:2,  sym:'++', name:'sehr gut'},
  {k:'r1', v:1,  sym:'+',  name:'gut'},
  {k:'r0', v:0,  sym:'○',  name:'mittel'},
  {k:'rm1',v:-1, sym:'−',  name:'schwach'},
  {k:'rm2',v:-2, sym:'−−', name:'sehr schwach'}
];
var byV=function(v){return RATINGS.filter(function(r){return r.v===v;})[0];};
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var uid=function(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);};
var p2=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
var todayStr=function(){return ymd(new Date());};

function fmtDate(s,long){if(!s)return 'Ohne Datum';var d=new Date(s+'T12:00:00');return WD[d.getDay()]+' '+p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+(long?d.getFullYear():'');}

/* Sitzplan: pos[Schüler-ID] = Platz; Platz = Reihe*(Doppelbänke*2)+Spalte, Reihe 0 = vorn (Tafel) */
function normPlan(c){
  var p=c.plan&&typeof c.plan==='object'?c.plan:{};
  var rows=Math.max(1,Math.min(12,parseInt(p.rows,10)||4)),desks=Math.max(1,Math.min(8,parseInt(p.desks,10)||3));
  var ids={};c.students.forEach(function(s){ids[s.id]=1;});
  var pos={},used={},max=rows*desks*2;
  Object.keys(p.pos&&typeof p.pos==='object'?p.pos:{}).forEach(function(id){
    var n=p.pos[id];
    if(ids[id]&&Number.isInteger(n)&&n>=0&&n<max&&!used[n]){pos[id]=n;used[n]=1;}
  });
  return {on:!!p.on,rows:rows,desks:desks,pos:pos,init:!!p.init||Object.keys(pos).length>0};
}
/* Plätze bei geänderter Raumgröße übernehmen (Reihe/Spalte bleiben, Überstehende gehen in die Ablage) */
function planRemap(oldDesks,pos,rows,desks){
  var oc=oldDesks*2,nc=desks*2,out={};
  Object.keys(pos).forEach(function(id){
    var n=pos[id],r=Math.floor(n/oc),k=n%oc;
    if(r<rows&&k<nc)out[id]=r*nc+k;
  });
  return out;
}
function seatAutoFill(c){
  var p=c.plan,max=p.rows*p.desks*2;
  var list=c.students.slice().sort(function(a,b){return (a.last+' '+a.first).localeCompare(b.last+' '+b.first,'de');});
  p.pos={};
  list.slice(0,max).forEach(function(s,i){p.pos[s.id]=i;});
  p.init=true;
}
function normalize(s){

  s.settings=Object.assign(d.settings,s.settings||{});
  if(!s.settings.compact){s.settings.compact=1;s.settings.cols=3;}
  if(!s.settings.uiV2){s.settings.uiV2=1;s.settings.firstOnly=true;}
  s.courses.forEach(function(c,i){
    c.color=c.color||PAL[i%PAL.length];
    c.students=Array.isArray(c.students)?c.students:[];
    c.jokerEvery=Math.max(1,parseInt(c.jokerEvery,10)||5);
    delete c.pickDone;
    c.round=c.round&&Array.isArray(c.round.skip)?{d:String(c.round.d||''),skip:c.round.skip}:{d:'',skip:[]};
    c.plan=normPlan(c);
  });
  s.v=1;
  return s;
}

    hist.undo.push(hist.last);if(hist.undo.length>50)hist.undo.shift();

function updateUndoBtns(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-act="hundo"]'),function(b){b.disabled=!hist.undo.length;});
  Array.prototype.forEach.call(document.querySelectorAll('[data-act="hredo"]'),function(b){b.disabled=!hist.redo.length;});

function histStep(from,to){
  if(!from.length)return false;
  var s=from.pop();to.push(hist.last);
  var a=JSON.parse(s),before=state.events;
  hist.busy=true;state.courses=a[0];state.events=a[1];save();hist.busy=false;hist.last=s;
  var c=course(),keep=c?c.students.map(function(x){return x.id;}):[];
  ui.sel=ui.sel.filter(function(id){return keep.indexOf(id)>=0;});
  if(ui.sheet&&ui.sheet.sid&&keep.indexOf(ui.sheet.sid)<0)closeSheet();
  if(ui.pick&&ui.pick.sid&&keep.indexOf(ui.pick.sid)<0){ui.pick=null;if(ui.view&&ui.view.type==='pick')ui.view=null;}
  /* In der Heutigen Bewertung zur betroffenen Person springen, damit man sie gleich neu bewerten kann */
  if(ui.pick&&ui.view&&ui.view.type==='pick'){
    var was={},now={},hit=null;
    before.forEach(function(e){was[e.id]=e.val;});
    state.events.forEach(function(e){now[e.id]=e.val;});
    state.events.concat(before).some(function(e){
      if(e.type==='rate'&&keep.indexOf(e.sid)>=0&&was[e.id]!==now[e.id]){hit=e;return true;}
      return false;
    });
    if(hit)ui.pick.sid=hit.sid;
  }
  updateUndoBtns();afterChange();
  return true;
}

/* Automatische Sicherungen: nach jeder Änderung ein Schnappschuss in IndexedDB (die letzten 20 plus je einer pro Tag der letzten 14 Tage) */
var idbP=null,snapTimer=null,lastSnapKey='';
function idb(){
  if(idbP)return idbP;
  idbP=new Promise(function(res,rej){
    try{
      var r=indexedDB.open('mitarbeit-backup',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('snaps',{keyPath:'ts'});};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){rej(r.error);};
    }catch(e){rej(e);}
  });
  return idbP;
}
function snapOp(mode,fn){
  return idb().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction('snaps',mode),out=fn(tx.objectStore('snaps'));
    tx.oncomplete=function(){res(out&&'result' in out?out.result:undefined);};
    tx.onerror=function(){rej(tx.error);};
  });});
}
function snapList(){return snapOp('readonly',function(st){return st.getAll();}).then(function(a){return (a||[]).sort(function(x,y){return y.ts-x.ts;});});}
function snapClear(){return snapOp('readwrite',function(st){return st.clear();}).catch(function(){});}
function snapSoon(){clearTimeout(snapTimer);snapTimer=setTimeout(function(){snapNow();},1200);}
function snapNow(force){
  var key=JSON.stringify([state.courses,state.events]);
  if(!force&&key===lastSnapKey)return Promise.resolve();
  if(!state.courses.length&&!state.events.length)return Promise.resolve();
  lastSnapKey=key;
  var rec={ts:Date.now(),json:JSON.stringify(state),nc:state.courses.length,ne:state.events.length};
  return snapOp('readwrite',function(st){return st.put(rec);}).then(snapPrune).catch(function(){});
}
function snapPrune(){
  return snapList().then(function(list){
    var keep={},days={};
    list.forEach(function(r,i){
      if(i<20)keep[r.ts]=1;
      var d=ymd(new Date(r.ts));
      if(!days[d]){days[d]=1;if(Object.keys(days).length<=14)keep[r.ts]=1;}
    });
    var del=list.filter(function(r){return !keep[r.ts];});
    if(!del.length)return;
    return snapOp('readwrite',function(st){del.forEach(function(r){st.delete(r.ts);});});
  });
}

      ui.stamp=null;ui.sel=[];ui.view=null;ui.draft=null;ui.pick=null;renderView();closeSheet();render();toast('Sicherung vom '+when+' geladen');

/* Android-App (Capacitor): Teilen, Zurück-Taste und Wachhalten laufen über native Plugins */
var CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
function plug(n){return NATIVE&&CAP.Plugins?CAP.Plugins[n]||null:null;}
function blobB64(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1]||'');};fr.onerror=function(){rej(fr.error);};fr.readAsDataURL(blob);});}
/* Datei in den App-Cache schreiben und das Android-Teilen-Fenster öffnen (Drive, Dateien, E-Mail, „Öffnen mit“). true = geteilt, false = abgebrochen/Fehler */
function nativeShare(blob,name){
  var fs=plug('Filesystem'),sh=plug('Share');
  if(!fs||!sh){toast('Teilen ist in dieser App-Version nicht verfügbar.');return Promise.resolve(false);}
  return blobB64(blob).then(function(b64){
    return fs.writeFile({path:name,data:b64,directory:'CACHE'});
  }).then(function(w){
    return sh.share({title:name,url:w.uri,dialogTitle:name}).then(function(){return true;});
  }).catch(function(e){
    if(/cancel/i.test((e&&e.message)||String(e)))return false;
    toast('Die Datei konnte nicht geteilt werden.');return false;
  });
}

function stats(evs,lo,hi){
  var o={n:0,sum:0,dist:[0,0,0,0,0],tags:{},jok:0,red:0,avg:null};
  evs.forEach(function(e){
    if(!inB(e,[lo,hi]))return;
    if(e.type==='rate'){o.n++;o.sum+=3-e.val;o.dist[2-e.val]++;}
    else if(e.type==='tag')o.tags[e.tag]=(o.tags[e.tag]||0)+1;
    else if(e.type==='joker')o.jok+=(e.n||1);
    else if(e.type==='redeem')o.red++;
  });
  o.avg=o.n?o.sum/o.n:null;
  return o;
}

  }
  if(key==='joker'){
    var before=jInfoNow(c,sid);
    ev=mkEvent(sid,'joker',opt.reason?{reason:opt.reason}:{});state.events.push(ev);save();

  }

    ev=mkEvent(sid,'redeem');state.events.push(ev);save();

    if(m.length)ui.ch[ctx]=(ui.ch[ctx]+(e.key==='ArrowDown'?1:-1)+m.length)%m.length;

function sortStudents(c,idx){
  var list=c.students.slice();
  var nm=function(s){return (s.last+' '+s.first).toLowerCase();};
  var mode=state.settings.sort;
  if(mode==='first')list.sort(function(a,b){return (a.first+' '+a.last).localeCompare(b.first+' '+b.last,'de');});
  else if(mode==='long'){
    var last=function(s){var m=0;(idx.get(s.id)||[]).forEach(function(e){if(e.type==='rate'&&e.ts>m)m=e.ts;});return m;};
    list.sort(function(a,b){return last(a)-last(b)||nm(a).localeCompare(nm(b),'de');});
  }
  else list.sort(function(a,b){return nm(a).localeCompare(nm(b),'de');});
  return list;
}
function backupDue(){
  var s=state.settings,now=Date.now();
  if(state.events.length<15)return null;
  if(s.backupSnooze&&now<s.backupSnooze)return null;
  if(!s.lastBackup)return 'noch nie';
  var days=Math.floor((now-s.lastBackup)/864e5);
  return days>=7?'vor '+days+' Tagen':null;
}
/* Anzeigenamen der Kacheln: bei „Nur Vornamen“ kürzt gleiche Vornamen auf „Tom M.“, bei gleichem Anfangsbuchstaben bleibt der volle Nachname */
function labelMap(c){
  var m=new Map(),groups={};
  c.students.forEach(function(s){
    m.set(s.id,{fn:s.first||s.last,ln:s.first?s.last:''});
    if(state.settings.firstOnly&&s.first){var k=nrm(s.first.trim());(groups[k]=groups[k]||[]).push(s);}
  });
  if(!state.settings.firstOnly)return m;
  c.students.forEach(function(s){
    var g=groups[s.first?nrm(s.first.trim()):''],last=String(s.last||'').trim(),sfx='';
    if(g&&g.length>1&&last){
      var ini=nrm(last).charAt(0);
      var clash=g.some(function(o){return o!==s&&nrm(String(o.last||'').trim()).charAt(0)===ini;});
      sfx=clash?last:last.charAt(0).toUpperCase()+'.';
    }
    m.set(s.id,{fn:s.first?(s.first.trim()+(sfx?' '+sfx:'')):s.last,ln:''});
  });
  return m;
}
function tileHTML(s,evs,c,dd,cols,labs,seat){
  var day=evs.filter(function(e){return e.date===dd;}).sort(function(a,b){return a.ts-b.ts;});
  var rates=day.filter(function(e){return e.type==='rate';});
  var lastR=rates[rates.length-1];
  var tc=lastR?'var(--'+byV(lastR.val).k+')':'';
  var jk=jokerInfo(evs,c.jokerEvery);
  var items=[],said=[],jN=0,jTs=0;
  var add=function(key,ts,cls,txt){var l=items[items.length-1];if(l&&l.key===key){l.n++;l.ts=ts;}else items.push({key:key,ts:ts,cls:cls,txt:txt,n:1});};
  day.forEach(function(e){
    if(e.type==='rate'){var r=byV(e.val);add('r'+e.val,e.ts,r.k,r.sym);said.push(r.sym);}
    else if(e.type==='joker'){jN+=(e.n||1);jTs=e.ts;said.push('Joker-Punkt');}
    else if(e.type==='redeem'){add('redeem',e.ts,'jk','−J');said.push('Joker eingelöst');}
    else if(e.type==='tag'){add('t'+e.tag,e.ts,'tg',e.sh||e.tn||'?');said.push(e.tn||'Marker');}
  });
  if(jN)items.push({key:'jk',ts:jTs,cls:'jk',txt:'★'+(jN>1?jN:''),n:1});
  items.sort(function(a,b){return a.ts-b.ts;});
  var max=seat?1:cols===3?2:3,chips=[];

  var label=fullName(s)+(said.length?', heute: '+said.join(', '):'')+', Joker-Punkte '+jk.prog+' von '+c.jokerEvery+(jk.avail?', '+jk.avail+' Joker verfügbar':'');
  var lab=(labs&&labs.get(s.id))||{fn:s.first||s.last,ln:s.first?s.last:''};
  var act=seat&&planEditing()?'seatTap':'tile';
  return '<button class="tile'+(seat?' seat':'')+(ui.sel.indexOf(s.id)>=0?' picked':'')+(ui.moveSid===s.id?' mv':'')+(ui.flash===s.id?' flash':'')+(ui.lastSid===s.id?' last':'')+'" data-act="'+act+'" data-sid="'+s.id+'"'+(tc?' style="--tc:'+tc+'"':'')+' title="'+esc(fullName(s))+'" aria-label="'+esc(label)+'">'+

    (!seat&&lab.ln?'<span class="ln">'+esc(lab.ln)+'</span>':'')+'</span>'+
    '<span class="chips">'+chips.join('')+(seat?'':'<span class="jst" aria-hidden="true">★ '+jk.prog+'/'+c.jokerEvery+'</span>')+'</span>'+
  '</button>';
}
function nameMatch(toks,s){

function termDefaults(){
  var t=new Date(),y=t.getFullYear(),sy=t.getMonth()>=7?y:y-1;
  return {h1f:sy+'-08-01',h1t:(sy+1)+'-01-31',h2f:(sy+1)+'-02-01',h2t:(sy+1)+'-07-31'};
}
function terms(){
  var df=termDefaults(),s=state.settings.terms||{};
  return {h1:[s.h1f||df.h1f,s.h1t||df.h1t],h2:[s.h2f||df.h2f,s.h2t||df.h2t]};
}
var fmtDay=function(s){return s?s.split('-').reverse().join('.'):'';};
function rangeBounds(r){
  var t=todayStr();r=r||ui.range;
  if(r.p==='today')return [t,t];
  if(r.p==='7')return [addDays(t,-6),t];
  if(r.p==='30')return [addDays(t,-29),t];
  if(r.p==='h1'||r.p==='h2')return terms()[r.p].slice();
  if(r.p==='all')return ['0000-00-00','9999-99-99'];
  return [r.from||'0000-00-00',r.to||'9999-99-99'];
}
function rangeLabel(r){
  r=r||ui.range;var b=rangeBounds(r),span=fmtDay(b[0])+' – '+fmtDay(b[1]);
  if(r.p==='today')return 'Heute ('+fmtDay(b[0])+')';
  if(r.p==='7')return 'Letzte 7 Tage ('+span+')';
  if(r.p==='30')return 'Letzte 30 Tage ('+span+')';
  if(r.p==='h1')return '1. Halbjahr ('+span+')';
  if(r.p==='h2')return '2. Halbjahr ('+span+')';
  if(r.p==='all')return 'Gesamter Zeitraum';
  return (r.from||r.to)?(r.from?'ab '+fmtDay(r.from):'')+(r.from&&r.to?' ':'')+(r.to?'bis '+fmtDay(r.to):''):'Gesamter Zeitraum';
}
var inB=function(e,b){return e.date?(e.date>=b[0]&&e.date<=b[1]):(b[0]==='0000-00-00'&&b[1]==='9999-99-99');};
var RANGES=[['today','Heute'],['7','Letzte 7 Tage'],['30','Letzte 30 Tage'],['h1','1. Halbjahr'],['h2','2. Halbjahr'],['all','Gesamter Zeitraum'],['custom','Eigener Zeitraum …']];
/* Zeitraum: ein Knopf, der das Auswahl-Sheet öffnet (ctx 'eval' = Auswertung/Verlauf, 'pdf' = PDF-Export) */
function rangeChipsHTML(r,ctx,bf,bt){

  var h='<button class="rangebtn" data-act="rangeSheet" data-ctx="'+ctx+'" aria-haspopup="dialog"><span class="lt"><small style="margin:0 0 2px">Zeitraum</small>'+esc(rangeLabel(r))+'</span>'+IC.chev+'</button>';
  if(r.p==='custom')h+='<div class="dates"><input class="inp" type="date" data-bind="'+bf+'" value="'+esc(r.from)+'" aria-label="Von"><span>bis</span><input class="inp" type="date" data-bind="'+bt+'" value="'+esc(r.to)+'" aria-label="Bis"></div>';
  return h;
}
function shHead(title,sub){return '<div class="sh-head"><div><h2>'+title+'</h2>'+(sub?'<div class="sh-sub">'+sub+'</div>':'')+'</div><button class="iconbtn" data-act="close" aria-label="Schließen">'+IC.close+'</button></div>';}
function rangeSheet(ctx){

    var b=(o[0]==='custom'||o[0]==='all')?null:rangeBounds({p:o[0]});

  }).join('')+'</div><p class="hint" style="margin-top:12px">Die Halbjahre lassen sich unter Mehr → Halbjahre anpassen.</p>';
}
function evalRows(c){
  var idx=idxFor(c.id),b=rangeBounds();
  return c.students.map(function(s){var evs=idx.get(s.id)||[];return {s:s,st:stats(evs,b[0],b[1]),jk:jokerInfo(evs,c.jokerEvery)};});
}
function sortRows(rows){
  var k=ui.tsort.k,dir=ui.tsort.dir;
  var G=function(r){
    if(k==='name')return (r.s.last+' '+r.s.first).toLowerCase();
    if(k==='avg')return r.st.avg;
    if(k==='n')return r.st.n;
    if(k==='jp')return r.jk.pts;
    if(k==='ja')return r.jk.avail;
    if(k.indexOf('tag:')===0)return r.st.tags[k.slice(4)]||0;
    return 0;
  };
  rows.sort(function(a,b){
    var x=G(a),y=G(b);
    if(k==='avg'){if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;}
    if(typeof x==='string')return x.localeCompare(y,'de')*dir;
    return (x-y)*dir;
  });
  return rows;
}

      [['name','Name'],['avg','Ø Tendenz'],['n','Bewertungen'],['jp','Joker-Punkte']].map(function(o){return '<option value="'+o[0]+'"'+(ui.tsort.k===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></label></div>';
    html+='<div class="ecards">'+rows.map(function(r){
      return '<button class="ecard" data-act="detail" data-sid="'+r.s.id+'"><span class="en"><b>'+esc(r.s.first||r.s.last)+'</b><small>'+esc(r.s.first?r.s.last:'')+'</small></span>'+
        '<span class="ed">'+distBar(r)+'<small>'+r.st.n+' Bewertung'+(r.st.n===1?'':'en')+(r.jk.pts?' · ★ '+r.jk.pts:'')+'</small></span>'+

    }).join('')+'</div>';
  }else{
    if(none.length&&tot>0)html+='<details class="box"><summary>Ohne Bewertung im Zeitraum ('+none.length+')</summary><div class="none-list">'+none.map(function(r){return '<button data-act="detail" data-sid="'+r.s.id+'">'+esc(fullName(r.s))+'</button>';}).join('')+'</div></details>';
    html+='<div class="tw" style="margin-top:8px"><table class="tbl"><thead><tr>'+th('name','Name')+th('avg','Ø')+th('n','Bew.')+'<th>Verteilung</th>'+th('jp','Joker-P.')+th('ja','Joker')+tags.map(function(t){return th('tag:'+t.id,esc(t.name));}).join('')+'</tr></thead><tbody>'+

function evText(e){

}
/* Verlauf: bis 19 Bewertungen Balken, ab LINE_MIN eine Linie. avg/cavg = Ø der Person bzw. des Kurses (Note 1–5) als gestrichelte Linie */
function avgLines(x1,x2,yOf,avg,cavg){
  var o='';
  if(cavg!=null)o+='<line x1="'+x1+'" x2="'+x2+'" y1="'+yOf(cavg)+'" y2="'+yOf(cavg)+'" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="1 3" stroke-linecap="round"/>';
  if(avg!=null)o+='<line x1="'+x1+'" x2="'+x2+'" y1="'+yOf(avg)+'" y2="'+yOf(avg)+'" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="5 3"/>';
  return o;
}
function lineSVG(rs,avg,cavg){
  var n=rs.length,W=360,H=150,L=44,R=10,T=10,B=10,iw=W-L-R,ih=H-T-B;
  var X=function(i){return L+(n>1?i*iw/(n-1):iw/2);},Y=function(g){return T+(g-1)/4*ih;};
  var out='<svg class="trend" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Verlauf der Bewertungen als Liniendiagramm, Note 1 oben">';
  RATINGS.forEach(function(r,i){
    out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(i+1)+'" y2="'+Y(i+1)+'" stroke="var(--line)" stroke-width="1"/>'+
      '<text x="'+(L-6)+'" y="'+(Y(i+1)+3)+'" text-anchor="end" font-size="9" fill="currentColor">'+(i+1)+' · '+r.sym+'</text>';
  });
  out+=avgLines(L,W-R,Y,avg,cavg);
  out+='<polyline fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round" points="'+rs.map(function(e,i){return X(i).toFixed(1)+','+Y(3-e.val).toFixed(1);}).join(' ')+'"/>';
  rs.forEach(function(e,i){out+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(3-e.val).toFixed(1)+'" r="2.6" style="fill:var(--'+byV(e.val).k+')" stroke="var(--bg)" stroke-width="1"/>';});
  return out+'</svg>';
}
function barSVG(rs,avg,cavg){
  var w=rs.length*12,mid=32,out='<svg class="spark" viewBox="0 0 '+w+' 64" role="img" aria-label="Verlauf der letzten Bewertungen"><line x1="0" x2="'+w+'" y1="'+mid+'" y2="'+mid+'" stroke="var(--line)" stroke-width="1"/>';
  rs.forEach(function(e,i){
    var h=Math.abs(e.val)*14+(e.val===0?3:0),y=e.val>=0?mid-h:mid;
    if(e.val===0)y=mid-1.5;
    out+='<rect x="'+(i*12+2)+'" y="'+y+'" width="8" height="'+h+'" rx="2" style="fill:var(--'+byV(e.val).k+')"/>';
  });
  return out+avgLines(0,w,function(g){return mid-(3-g)*14;},avg,cavg)+'</svg>';
}
function trendHTML(evs,avg,cavg){
  var rs=evs.filter(function(e){return e.type==='rate';}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts;});
  if(rs.length<2)return '';
  var line=rs.length>=LINE_MIN,shown=rs.slice(line?-100:-30);
  var key=function(css,txt){return '<span><svg viewBox="0 0 22 8" aria-hidden="true"><line x1="1" x2="21" y1="4" y2="4" stroke="'+css.c+'" stroke-width="'+css.w+'" stroke-dasharray="'+css.d+'" stroke-linecap="round"/></svg>'+txt+'</span>';};
  var leg='<div class="tlegend"><span>Letzte '+shown.length+' Bewertungen, älteste links'+(line?' · oben = Note 1':'')+'</span>'+
    (avg!=null?key({c:'var(--ink)',w:1.2,d:'5 3'},'Ø '+fmtNum(avg)):'')+
    (cavg!=null?key({c:'var(--muted)',w:1.5,d:'1 3'},'Ø Kurs '+fmtNum(cavg)):'')+'</div>';
  return (line?lineSVG(shown,avg,cavg):barSVG(shown,avg,cavg))+leg;
}

function parseStudents(text){

/* ───────── Alte Daten einfügen ───────── */
var impNorm=function(s){return String(s||'').normalize('NFC').toLowerCase().replace(/[.,;:]+/g,' ').replace(/\s+/g,' ').trim();};
var impKey=function(s){return impNorm(s).split(' ').filter(Boolean).sort().join(' ');};
var NUMCELL=/^(\d+|[-−–—]?)$/;
var SUMCOLS=['++','+','o','-','--','j'];
var MAXN=500;

/* Datum in einer Zeile finden: 31.12.2026, 31.12.26, 31.12. (Jahr ergänzt) oder 2026-12-31 */
function findDate(line,defDate){
  var m=/(^|[^\d.])(\d{4})-(\d{1,2})-(\d{1,2})(?!\d)/.exec(line),y,mo,d,rest,bad=false;
  if(m){y=+m[2];mo=+m[3];d=+m[4];rest=line.replace(m[0],m[1]+' ');}
  else{
    m=/(^|[^\d.])(\d{1,2})\.\s?(\d{1,2})\.(\d{4}|\d{2})?(?!\d)/.exec(line);
    if(!m)return null;
    mo=+m[3];d=+m[2];
    rest=line.replace(m[0],m[1]+' ');
    if(m[4])y=m[4].length===2?2000+(+m[4]):+m[4];
    else{
      y=+(defDate||todayStr()).slice(0,4);
      if(ymd(new Date(y,mo-1,d))>todayStr())y--;
    }
  }
  var t=new Date(y,mo-1,d);
  if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return {bad:true};
  return {date:ymd(t),rest:rest.replace(/\s{2,}/g,' ').trim()};
}
/* Wörter mit Leerzeichen zu einem Token zusammenfassen */
function impPrep(str,tags){
  var s=' '+str.replace(/[−–—]/g,'-')+' ';
  s=s.replace(/(\s)sehr\s+gut(?=\s|$)/gi,'$1++').replace(/(\s)sehr\s+schwach(?=\s|$)/gi,'$1--')
     .replace(/(\s)joker\s+eingel(?:ö|oe)st(?=\s|$)/gi,'$1-J').replace(/(\s)joker[\s-]*punkte?(?=\s|$)/gi,'$1J');
  tags.slice().sort(function(a,b){return b.name.length-a.name.length;}).forEach(function(t){
    if(!t.name||!/\s/.test(t.name))return;
    s=s.replace(new RegExp('(\\s)'+t.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'(?=\\s|$)','gi'),'$1tag:'+t.id);
  });
  return s.trim();
}
function baseTok(low,tags){
  var m;
  if(low==='++'||low==='sehr gut')return {type:'rate',val:2};
  if(low==='+'||low==='gut')return {type:'rate',val:1};
  if(low==='o'||low==='○'||low==='0'||low==='='||low==='mittel')return {type:'rate',val:0};
  if(low==='-'||low==='schwach')return {type:'rate',val:-1};
  if(low==='--'||low==='sehr schwach')return {type:'rate',val:-2};
  if(/^[1-5]$/.test(low))return {type:'rate',val:3-(+low)};
  if(/^(j|jp|★|☆|\*|joker|jokerpunkte?)$/.test(low))return {type:'joker'};
  if(/^(-j|jokereingel(ö|oe)st|eingel(ö|oe)st)$/.test(low))return {type:'redeem'};
  if((m=/^tag:(.+)$/.exec(low))){var t0=tags.filter(function(x){return x.id.toLowerCase()===m[1];})[0];if(t0)return {type:'tag',tag:t0.id,tn:t0.name,sh:t0.short||t0.name.slice(0,3)};}
  var t=tags.filter(function(x){var n=x.name.toLowerCase(),sh=(x.short||'').toLowerCase();return low===n||(sh&&low===sh);})[0];
  if(t)return {type:'tag',tag:t.id,tn:t.name,sh:t.short||t.name.slice(0,3)};
  return null;
}
/* „3x+“, „2×★“ oder „+x3“ = mehrfach */
function valTok(tok,tags){
  var t=tok.trim(),n=1,m=/^(\d{1,3})\s*[x×]\s*(.+)$/i.exec(t);
  if(m){n=+m[1];t=m[2];}
  else if((m=/^(.+?)\s*[x×]\s*(\d{1,3})$/i.exec(t))){n=+m[2];t=m[1];}
  var b=baseTok(t.toLowerCase(),tags);
  if(!b)return null;
  b.n=n;return b;
}
function colKind(cell,tags){
  var c=impPrep(cell,tags),low=c.toLowerCase();
  if(/^(name|vorname|nachname|sch(ü|ue)ler(:?in)?|sch(ü|ue)ler\/?in(nen)?)$/.test(low))return 'name';
  if(/^(\d+)$/.test(low))return null;
  var b=baseTok(low,tags);
  return b;
}
/* Name → vorhandene Schüler:in (Reihenfolge von Vor- und Nachname egal) oder neu */
function makeResolver(c,create){
  var byKey={},byTok={},added=[],addedKey={};
  c.students.forEach(function(s){
    var k=impKey(s.first+' '+s.last);(byKey[k]=byKey[k]||[]).push(s);
    [s.first,s.last].forEach(function(p){var k2=impKey(p);if(k2&&k2.indexOf(' ')<0)(byTok[k2]=byTok[k2]||[]).push(s);});
  });
  var res=function(parts){
    var raw=parts.join(' '),k=impKey(raw);
    if(!k)return {err:'Kein Name'};
    var hit=byKey[k];
    if(!hit&&k.indexOf(' ')<0)hit=byTok[k];
    if(hit&&hit.length===1)return {sid:hit[0].id};
    if(hit&&hit.length>1)return {err:'Name nicht eindeutig: '+raw};
    if(addedKey[k])return {sid:addedKey[k].id};
    if(!create)return {err:'Unbekannter Name: '+raw};
    var f,l;
    if(parts.length>1){f=parts[0];l=parts.slice(1).join(' ');}
    else if(raw.indexOf(',')>-1){var m=raw.split(',');l=m[0].trim();f=m.slice(1).join(' ').trim();}
    else{var p=raw.split(/\s+/);if(p.length===1){f=p[0];l='';}else{l=p.pop();f=p.join(' ');}}
    var s={id:uid(),first:f,last:l};
    added.push(s);addedKey[k]=s;
    return {sid:s.id};
  };
  res.added=added;
  return res;
}
/* Eine Zeile in Name-Teile und Wertungs-Tokens zerlegen */
function splitLine(line,tags){
  var fields=/[\t;]/.test(line)?line.split(/\t|;/):[line],name=[],vals=[],bad=null;
  fields.forEach(function(f){
    f=f.trim();if(!f)return;
    var tk=f.split(/\s+/),vs=tk.map(function(t){return valTok(t,tags);});
    if(vs.every(Boolean)){vals=vals.concat(vs);return;}
    var a=0,b=tk.length;
    while(b>a+1&&vs[b-1])b--;
    if(b===tk.length)while(a<b-1&&vs[a])a++;
    vals=vals.concat(vs.slice(b).filter(Boolean),vs.slice(0,a).filter(Boolean));
    name.push(tk.slice(a,b).join(' '));
  });
  return {name:name,vals:vals};
}
function pushVal(rows,sid,date,v,n){
  var ev={sid:sid,date:date,type:v.type};
  if(v.type==='rate')ev.val=v.val;
  if(v.type==='tag'){ev.tag=v.tag;ev.tn=v.tn;ev.sh=v.sh;}
  if(v.type==='joker'){ev.n=n;rows.push(ev);return;}
  for(var i=0;i<n;i++)rows.push(Object.assign({},ev));
}
function buildImport(o,c){
  var tags=state.settings.tags,defDate=o.date||'',curD=defDate,rows=[],probs=[],lines=0,rs=makeResolver(c,o.create);
  var cols=null;
  String(o.text||'').split(/\r?\n/).forEach(function(raw,ln){
    var line=raw.trim();if(!line)return;
    var bad=function(m){probs.push({ln:ln+1,t:raw.trim(),m:m});};
    var di=findDate(line,defDate),d=curD;
    if(di&&di.bad)return bad('Ungültiges Datum');
    if(di){line=di.rest;d=di.date;if(!line){curD=di.date;return;}}
    line=impPrep(line,tags);
    if(o.mode==='entries'){
      var sp=splitLine(line,tags);
      if(!sp.vals.length)return bad('Keine Wertung erkannt');
      var r=rs(sp.name);if(r.err)return bad(r.err);
      lines++;
      sp.vals.forEach(function(v){
        if(v.n>MAXN)return bad('Zu viele Wiederholungen');
        pushVal(rows,r.sid,d,v,v.n);
      });
      return;
    }
    /* Summen: Kopfzeile (optional), danach Name + Zahlen */
    var cells=/[\t;]/.test(line)?line.split(/\t|;/).map(function(x){return x.trim();}):line.split(/\s+/);
    var kinds=cells.map(function(x){return colKind(x,tags);});
    var named=kinds.filter(function(k){return k&&k!=='name';});
    if(!cols&&named.length>=2&&!cells.some(function(x){return /^\d+$/.test(x);})){
      cols=kinds.filter(function(k){return k!=='name';});
      return;
    }
    var i=0,nm=[];
    while(i<cells.length&&!NUMCELL.test(cells[i])){nm.push(cells[i]);i++;}
    var nums=cells.slice(i);
    if(!nm.length)return bad('Kein Name');
    if(!nums.some(function(x){return /^\d+$/.test(x);}))return bad('Keine Zahlen erkannt');
    var colList=cols||SUMCOLS.map(function(k){return baseTok(k,tags);}).concat(tags.map(function(t){return baseTok('tag:'+t.id,tags);}));
    if(nums.length>colList.length)return bad('Mehr Zahlen als Spalten ('+colList.length+')');
    var r2=rs(nm.length>1&&!/[\t;]/.test(line)?[nm.join(' ')]:nm);if(r2.err)return bad(r2.err);
    var ok=true;
    nums.forEach(function(x,j){
      var n=/^\d+$/.test(x)?+x:0;
      if(!n)return;
      if(n>MAXN){ok=false;return bad('Zahl zu groß: '+x);}
      if(colList[j])pushVal(rows,r2.sid,d,colList[j],n);
    });
    if(ok)lines++;
  });
  return {rows:rows,added:rs.added,probs:probs,lines:lines};
}
function importPreview(){

  if(!String(o.text||'').trim())return {html:'<p class="hint">Füge oben Daten ein – hier erscheint dann die Vorschau.</p>',n:0};
  var undated=0,cnt={},sids={},dmin='9999-99-99',dmax='0000-00-00';

    if(!e.date)undated++;else{if(e.date<dmin)dmin=e.date;if(e.date>dmax)dmax=e.date;}

  var lab=[[ 'r2','++'],['r1','+'],['r0','○'],['r-1','−'],['r-2','−−'],['joker','★'],['redeem','Joker eingelöst']];
  var parts=lab.filter(function(l){return cnt[l[0]];}).map(function(l){return '<b>'+cnt[l[0]]+'</b>× '+l[1];});

function courseSave(){
  var d=ui.draft,isNew=ui.view.isNew;
  d.name=String(d.name||'').trim();
  if(!d.name){toast('Bitte einen Kursnamen eingeben.');var n=$('#cName');if(n)n.focus();return;}
  d.students=d.students.map(function(s){return {id:s.id,first:String(s.first||'').trim(),last:String(s.last||'').trim()};}).filter(function(s){return s.first||s.last;});
  d.jokerEvery=Math.max(1,Math.min(99,parseInt(d.jokerEvery,10)||5));
  var applyPlan=function(){
    var pd=planDims(d),oldC=isNew?null:state.courses.filter(function(c){return c.id===d.id;})[0],oldPlan=oldC&&oldC.plan;
    if(oldPlan&&(oldPlan.rows!==pd[0]||oldPlan.desks!==pd[1]))d.plan.pos=planRemap(oldPlan.desks,d.plan.pos,pd[0],pd[1]);
    d.plan.rows=pd[0];d.plan.desks=pd[1];
    d.plan=normPlan(d);
    if(d.plan.on&&!d.plan.init)seatAutoFill(d);
  };
  if(isNew){
    applyPlan();
    state.courses.push(d);state.settings.activeCourse=d.id;ui.tab='class';
  }else{
    var i=state.courses.findIndex(function(c){return c.id===d.id;});
    if(i<0)return;
    var keep=new Set(d.students.map(function(s){return s.id;}));
    var removed=state.courses[i].students.filter(function(s){return !keep.has(s.id);});
    var cnt=state.events.filter(function(e){return e.cid===d.id&&!keep.has(e.sid);}).length;
    if(removed.length&&cnt&&!confirm(removed.length+' Schüler:in(nen) entfernen? Alle zugehörigen Einträge ('+cnt+') werden dabei gelöscht.'))return;
    state.events=state.events.filter(function(e){return e.cid!==d.id||keep.has(e.sid);});
    d.round={d:(d.round&&d.round.d)||'',skip:((d.round&&d.round.skip)||[]).filter(function(id){return keep.has(id);})};
    applyPlan();
    state.courses[i]=d;
    if(d.archived&&state.settings.activeCourse===d.id)state.settings.activeCourse=null;
  }
  save();ui.view=null;ui.draft=null;renderView();render();toast('Kurs gespeichert');
}

function csvCell(v){v=v==null?'':String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(rows){return '﻿'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\r\n');}
var slug=function(s){return String(s).replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,'_').replace(/^_+|_+$/g,'')||'Kurs';};
function saveFile(name,mime,text){
  var blob=new Blob([text],{type:mime});
  if(NATIVE)return nativeShare(blob,name);
  try{
    var file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:name}).then(function(){return true;},function(e){if(e&&e.name==='AbortError')return false;return dl();});
    }
  }catch(e){}
  return Promise.resolve(dl());
  function dl(){
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    return true;
  }
}
function exportEval(){
  var c=course();if(!c)return;
  var tags=state.settings.tags,rows=sortRows(evalRows(c));
  var b=rangeBounds();
  var head=['Nachname','Vorname','Ø Tendenz (1–5)','Bewertungen','sehr gut','gut','mittel','schwach','sehr schwach','Joker-Punkte gesamt','Joker verfügbar','Joker eingelöst'].concat(tags.map(function(t){return t.name;}));
  var data=[head].concat(rows.map(function(r){
    return [r.s.last,r.s.first,r.st.avg==null?'':fmtNum(r.st.avg,2),r.st.n].concat(r.st.dist,[r.jk.pts,r.jk.avail,r.jk.red],tags.map(function(t){return r.st.tags[t.id]||0;}));
  }));
  if(showCAvg()){
    var ca=courseAvgStats(c,b[0],b[1]),ds=[0,0,0,0,0];
    rows.forEach(function(r){r.st.dist.forEach(function(n,i){ds[i]+=n;});});
    data.push(['Kurs gesamt','',ca.avg==null?'':fmtNum(ca.avg,2),ca.n].concat(ds));
  }
  saveFile('Mitarbeit_'+slug(c.name)+'_'+todayStr()+'.csv','text/csv;charset=utf-8',toCSV(data));
}
function exportLog(){
  var c=course();if(!c)return;
  var b=rangeBounds(),names={};c.students.forEach(function(s){names[s.id]=s;});
  var evs=state.events.filter(function(e){return e.cid===c.id&&(e.date?(e.date>=b[0]&&e.date<=b[1]):(b[0]==='0000-00-00'&&b[1]==='9999-99-99'))&&names[e.sid];}).sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:x.ts-y.ts;});
  var rows=[['Datum','Uhrzeit','Nachname','Vorname','Art','Wert','Note-Äquivalent','Grund / Notiz']];
  evs.forEach(function(e){
    var s=names[e.sid],dt=e.date.split('-').reverse().join('.'),tm=e.bd?'':p2(new Date(e.ts).getHours())+':'+p2(new Date(e.ts).getMinutes());
    var art='',val='',eq='',txt='';
    if(e.type==='rate'){var r=byV(e.val);art='Mitarbeit';val=r.name;eq=3-e.val;}
    else if(e.type==='joker'){art='Joker-Punkt';val=e.n||1;txt=e.reason||'';}
    else if(e.type==='redeem')art='Joker eingelöst';
    else if(e.type==='tag')art=e.tn||'Marker';
    else if(e.type==='note'){art='Notiz';txt=e.note||'';}
    else art=e.type;
    rows.push([dt,tm,s.last,s.first,art,val,eq,txt]);
  });
  saveFile('Mitarbeit_Protokoll_'+slug(c.name)+'_'+todayStr()+'.csv','text/csv;charset=utf-8',toCSV(rows));
}

/* Sitzplan: Schüler:in auf einen Platz (Zahl), in die Ablage ('pool') oder gegen eine andere Person (ID) tauschen */
function planMove(sid,target){
  var c=course(),p=c&&c.plan;if(!p)return;
  var tsid=null,slot=null;
  if(target==='pool'){delete p.pos[sid];}
  else{
    if(typeof target==='number'){
      slot=target;
      Object.keys(p.pos).forEach(function(id){if(p.pos[id]===slot)tsid=id;});
      if(tsid===sid)return;
      if(!tsid)p.pos[sid]=slot;
    }else tsid=target;
    if(tsid){
      var a=p.pos[sid],b=p.pos[tsid];
      if(b==null)delete p.pos[sid];else p.pos[sid]=b;
      if(a==null)delete p.pos[tsid];else p.pos[tsid]=a;
    }
  }
  save();refreshGrid();
}
/* Ziehen mit Maus und Touch (nur im Bearbeiten-Modus): Pointer Events, da HTML5-Drag&Drop auf dem Handy nicht geht */
var dnd={sid:null,id:null,x:0,y:0,on:false,ghost:null,src:null,over:null,doneAt:0};
function dndEnd(){
  if(dnd.ghost)dnd.ghost.remove();
  if(dnd.src)dnd.src.classList.remove('dragsrc');
  if(dnd.over)dnd.over.classList.remove('over');
  dnd.sid=null;dnd.on=false;dnd.ghost=null;dnd.src=null;dnd.over=null;
}

  var t=e.target.closest&&e.target.closest('.seat[data-sid]');if(!t)return;
  dndEnd();
  dnd.sid=t.dataset.sid;dnd.id=e.pointerId;dnd.x=e.clientX;dnd.y=e.clientY;dnd.src=t;
});
document.addEventListener('pointermove',function(e){
  if(!dnd.sid||e.pointerId!==dnd.id)return;
  if(!dnd.on){
    if(Math.hypot(e.clientX-dnd.x,e.clientY-dnd.y)<8)return;
    dnd.on=true;
    var r=dnd.src.getBoundingClientRect(),g=dnd.src.cloneNode(true);
    g.className+=' ghost';g.style.width=r.width+'px';g.removeAttribute('data-act');
    document.body.appendChild(g);dnd.ghost=g;dnd.src.classList.add('dragsrc');
  }
  e.preventDefault();
  dnd.ghost.style.transform='translate('+(e.clientX-dnd.ghost.offsetWidth/2)+'px,'+(e.clientY-dnd.ghost.offsetHeight/2)+'px)';
  var el=document.elementFromPoint(e.clientX,e.clientY),tg=el&&el.closest?el.closest('.slot,.pool'):null;
  if(tg!==dnd.over){if(dnd.over)dnd.over.classList.remove('over');if(tg)tg.classList.add('over');dnd.over=tg;}
  if(e.clientY<60)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-60)window.scrollBy(0,14);
},{passive:false});
document.addEventListener('pointerup',function(e){
  if(!dnd.sid||e.pointerId!==dnd.id)return;
  var moved=dnd.on,sid=dnd.sid,tg=dnd.over;
  dndEnd();
  if(!moved)return;

/* Handy: Kopf- und Stempelleiste fahren beim Hinunterscrollen ein und beim Hinaufscrollen wieder aus */
var lastY=0,scrollTick=false;
function showBars(){document.body.classList.remove('hide-hdr','hide-dock');}
function hideBars(){document.body.classList.add('hide-hdr');}
window.addEventListener('scroll',function(){
  if(scrollTick)return;scrollTick=true;
  requestAnimationFrame(function(){
    scrollTick=false;
    if(ui.sheet||ui.view)return;
    if(!window.matchMedia('(max-width:699px)').matches){showBars();return;}
    var y=window.pageYOffset,dy=y-lastY,max=document.documentElement.scrollHeight-window.innerHeight;
    if(y<=10||y>=max-4||dy<-6)showBars();
    else if(dy>6&&y>50)hideBars();
    if(Math.abs(dy)>3)lastY=y;
  });
},{passive:true});

/* ───────── Updates: Versionsprüfung und Ziehen zum Aktualisieren ───────── */
var lastChk=0;
var appVer=function(t){var m=/<meta name="app-version" content="([^"]*)"/.exec(t);return m?m[1]:null;};
var myVer=(document.querySelector('meta[name="app-version"]')||{}).content||null;
function checkUpdate(manual){
  var now=Date.now();
  if(!manual&&now-lastChk<5*60000)return Promise.resolve(false);
  lastChk=now;
  if(NATIVE||!/^https?:$/.test(location.protocol))return Promise.resolve(false);
  if('serviceWorker' in navigator)navigator.serviceWorker.getRegistration().then(function(r){return r&&r.update();}).catch(function(){});
  return fetch('index.html',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http');return r.text();}).then(function(t){
    var v=appVer(t);
    if(v&&myVer&&v!==myVer){toast('Neue Version verfügbar',function(){location.reload();},false,'Neu laden',30000);return true;}
    return false;
  }).catch(function(){return null;});
}
(function(){
  var startY=null,startX=0,pull=0,busy=false,TH=72,ind=null;
  var el=function(){if(!ind){ind=document.createElement('div');ind.id='ptr';ind.setAttribute('aria-hidden','true');ind.innerHTML='<i></i>';document.body.appendChild(ind);}return ind;};
  var reset=function(){startY=null;pull=0;if(ind&&!busy){ind.classList.remove('on','ready');ind.style.transform='';}};
  document.addEventListener('touchstart',function(e){
    if(NATIVE||busy||e.touches.length!==1||ui.sheet||ui.view||window.pageYOffset>0)return;
    if(e.target.closest&&e.target.closest('input,textarea,select,.rng,.tw,.ntw,.xrow,.pdflist,#dock,#sheetWrap'))return;
    startY=e.touches[0].clientY;startX=e.touches[0].clientX;pull=0;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(startY==null)return;
    var dy=e.touches[0].clientY-startY,dx=Math.abs(e.touches[0].clientX-startX);
    if(dy<=0||window.pageYOffset>0||dx>dy){reset();return;}
    pull=Math.min(dy*0.5,110);
    if(pull>6){var n=el();n.classList.add('on');n.classList.toggle('ready',pull>=TH);n.style.transform='translate(-50%,'+(pull-34)+'px) rotate('+(pull*3)+'deg)';}
  },{passive:true});
  var end=function(){
    if(startY==null)return;
    if(pull>=TH){
      busy=true;var n=el();n.classList.add('on','spin');n.style.transform='translate(-50%,'+(TH-34)+'px)';buzz(15);
      checkUpdate(true).then(function(newer){
        if(newer)return;
        render();
        toast(newer===null?'Keine Verbindung – Version nicht geprüft':'Aktuell – du hast die neueste Version');
      }).then(function(){busy=false;n.classList.remove('on','spin','ready');n.style.transform='';});
    }
    reset();
  };
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',reset,{passive:true});
})();

/* Zurück-Taste (Android): erst Fenster und Auswahl schließen, dann zu „Unterricht“, erst dann die App verlassen */
function handleBack(){
  if(ui.sheet){closeSheet();return true;}
  if(ui.view){
    var lose=(ui.view.type==='nachtrag'&&ui.nt&&ntTotal())||(ui.view.type==='import'&&ui.imp&&String(ui.imp.text||'').trim());
    if(lose&&!confirm('Eingaben verwerfen?'))return true;
    closeView();return true;
  }
  if(ui.sel.length){selClear('class');return true;}
  if(ui.stamp){A.stampOff();return true;}
  if(ui.tab==='more'&&ui.more){ui.more=null;renderMain();window.scrollTo(0,0);return true;}
  if(ui.tab!=='class'){ui.tab='class';showBars();render();window.scrollTo(0,0);return true;}
  return false;
}

  if(!e.state||e.state.m!==0)return;
  if(handleBack()){try{history.pushState({m:1},'');}catch(x){}}

});
