<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mitarbeit">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131B" media="(prefers-color-scheme: dark)">
<title>Mitarbeit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#17202F; --muted:#586275; --line:#D5DBE4;
  --brand:#25406B; --on-brand:#FFFFFF;
  --r2:#0F7A63; --r1:#2F8F6A; --r0:#6E798C; --rm1:#B8651A; --rm2:#C0392B;
  --joker:#E0A100; --on-joker:#3A2A00; --joker-soft:#FFF1C2;
  --danger:#B3261E;
  --dockh:0px; --cc:#2F5FD0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E131B;--surface:#161D28;--surface2:#1D2633;--ink:#E7ECF4;--muted:#9BA7B9;--line:#2A3444;
        --brand:#9DBBEA;--on-brand:#0E131B;--joker-soft:#3A2F09;--danger:#F2766E}
}
.r2{--c:var(--r2)} .r1{--c:var(--r1)} .r0{--c:var(--r0)} .rm1{--c:var(--rm1)} .rm2{--c:var(--rm2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--ui);-webkit-font-smoothing:antialiased;touch-action:manipulation}
body.overlay{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h2,h3{margin:0}
.muted{color:var(--muted)}

/* Kopfbereich */
#hdr{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;border-top:4px solid var(--cc);border-bottom:1px solid var(--line)}
.hin{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"c d" "t t";gap:6px 10px;align-items:center;max-width:1400px;margin:0 auto}
.cbtn{grid-area:c;display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left;padding:0}
.ct{font:600 20px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cbtn .ct::after{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);margin-left:9px}
.cs{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.datechip{grid-area:d;display:inline-flex;align-items:center;height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.datechip.alt{border-color:var(--joker);background:var(--joker-soft)}
.pill-btn{height:38px;padding:0 12px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-weight:600;font-size:14px}
.tabs{grid-area:t;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.tab{padding:6px 2px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.tab[aria-selected=true]{background:var(--cc);color:#fff}

#main{padding:8px 10px calc(var(--dockh) + 20px + env(safe-area-inset-bottom));max-width:1400px;margin:0 auto}
body.nodock #main{padding-bottom:calc(20px + env(safe-area-inset-bottom))}

/* Werkzeugleiste */
.tbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 0 8px}
.tbar .btn{height:38px;padding:0 12px;font-size:14px;flex:0 0 auto}
.tbar select{padding:7px 8px}
.sel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:1;min-width:0}
.sel select{flex:1;min-width:0;width:100%;text-overflow:ellipsis}
.sel span{flex:0 0 auto}
select,.inp,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
select{padding-right:6px}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{min-width:38px;height:32px;border-radius:7px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 12px;margin-bottom:10px;border:1.5px solid var(--joker);background:var(--joker-soft);border-radius:10px;font-size:13.5px;line-height:1.35}
.banner>span{flex:1 1 220px}
.banner.warn{border-color:var(--danger)}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}

/* Kacheln */
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:6px;--tmin:200px}
.grid.c3{--tmin:160px}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;padding:6px 8px 6px 9px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc,var(--line));border-radius:8px;transition:transform .08s}
.tile:active{transform:scale(.97)}
.fn{display:block;font:600 18px/1.15 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.ln{display:block;font-size:13px;line-height:1.25;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chips{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;overflow:hidden;min-height:20px;margin-top:2px}
.chip{min-width:20px;height:20px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;font:700 12px/1 var(--ui);font-style:normal;color:#fff;background:var(--c,var(--muted))}
.chip.jk{background:var(--joker);color:var(--on-joker)}
.chip.tg{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.chip.st{background:transparent;color:var(--muted);border:1px solid var(--muted);font-weight:600}
.chip.more{background:transparent;color:var(--muted)}
.pips{display:flex;gap:3px;align-items:center;flex:0 0 auto;font-size:11.5px;color:var(--muted)}
.pip{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--joker)}
.pip.f{background:var(--joker)}
.jb{margin-left:auto;flex:0 0 auto;font:700 11px/1 var(--ui);padding:3px 7px;border-radius:999px;background:var(--joker);color:var(--on-joker);white-space:nowrap}
.grid.c3 .tile{padding:7px 6px 7px 8px}
.grid.c3 .jl{display:none}
@media (hover:hover){.tile:hover{border-color:var(--cc)}.stamp:hover,.xs:hover,.rbtn:hover{filter:brightness(1.08)}.xs:hover{border-color:var(--ink)}}
.grid.c3 .pip{width:7px;height:7px}
.grid.c3 .pips{gap:2px}
.grid.c3 .fn{font-size:16px}
.grid.c3 .ln{font-size:12px}
@keyframes stamp{0%{transform:scale(1)}35%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(1.8);opacity:.2}100%{transform:scale(1);opacity:1}}
.tile.flash{animation:stamp .28s ease-out}
.tile.flash .chip.nw{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){.tile.flash,.tile.flash .chip.nw{animation:none}}

/* Stempelleiste */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
body.nodock #dock{display:none}
.dhint{font-size:12.5px;line-height:1.3;color:var(--muted);min-height:24px;margin:0 2px 3px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dhint .hl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhint .stop{flex:0 0 auto;font-weight:700;font-size:13px;color:var(--brand);padding:6px 4px}
.dhint b{color:var(--ink)}
.dhint select{padding:4px 6px;font-size:14px;max-width:150px;flex:0 1 auto}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:560px;margin:0 auto}
.stamp{height:44px;border-radius:12px;color:#fff;background:var(--c);font:700 26px/1 var(--serif);transition:transform .08s,opacity .12s}
.stamp:active{transform:scale(.95)}
#dock.armed .stamp:not(.on){opacity:.5}
.stamp.on{outline:3px solid var(--ink);outline-offset:2px}
.xrow{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.xrow::-webkit-scrollbar{display:none}
.xs{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);font-weight:600;font-size:15px;white-space:nowrap}
.xs.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xs.joker{border-color:var(--joker)}
.xs.joker.on{background:var(--joker);color:var(--on-joker)}
.xs svg{width:18px;height:18px}
#dock.armed .xs:not(.on):not(.pick){opacity:.5}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--dockh) + 12px);transform:translateX(-50%);z-index:70;display:none;align-items:center;gap:12px;width:max-content;max-width:min(92vw,520px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
#toast.show{display:flex}
#toast.gold{background:var(--joker);color:var(--on-joker)}
#toast button{font-weight:700;padding:6px 10px;border-radius:8px;border:1.5px solid currentColor;white-space:nowrap}
body.nodock #toast{bottom:calc(16px + env(safe-area-inset-bottom))}
body.overlay #toast{bottom:auto;top:calc(env(safe-area-inset-top) + 12px)}
body.view-open #toast{top:auto;bottom:calc(16px + env(safe-area-inset-bottom))}

/* Sheet */
#sheetWrap{position:fixed;inset:0;z-index:40;display:none}
#sheetWrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,12,20,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 32px rgba(0,0,0,.25);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.sh-head h2{font:600 24px/1.15 var(--serif)}
.sh-head h2 span{font-weight:400;color:var(--muted)}
.sh-sub{font-size:13px;color:var(--muted);margin-top:2px}
.sec{margin-top:16px}
.sec>h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.rbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;border-radius:12px;background:var(--c);color:#fff}
.rbtn b{font:700 24px/1 var(--serif)}
.rbtn small{font-size:10.5px;opacity:.95}
.rbtn:active{transform:scale(.96)}
.jline{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wrap{display:flex;gap:6px;flex-wrap:wrap}
.rchip,.act{min-height:40px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);font-weight:600;font-size:15px}
.act.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.joker,.rchip{border-color:var(--joker)}
.act.joker{background:var(--joker);color:var(--on-joker)}
.act:disabled{opacity:.45}
.act small{font-weight:500;opacity:.85}
.today{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;align-items:center}
.tchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 8px;border-radius:7px;background:var(--c,var(--surface2));color:#fff;font-weight:700;font-size:13px}
.tchip.jk{background:var(--joker);color:var(--on-joker)}
.tchip.tg,.tchip.st{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.tchip i{font-style:normal;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;opacity:.85;font-size:15px}
textarea{width:100%;resize:vertical;min-height:62px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{font-weight:600;color:var(--brand);padding:10px 0}
.clist{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.crow{display:flex;flex-direction:column;align-items:flex-start;padding:11px 13px;border:1.5px solid var(--line);border-left:7px solid var(--k,var(--line));border-radius:10px;background:var(--surface2);text-align:left}
.crow.on{outline:2px solid var(--k,var(--brand));outline-offset:-1px}
.crow b{font:600 18px/1.2 var(--serif)}
.crow small{color:var(--muted);font-size:13px}

/* Vollbild-Ansichten */
.view{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.view.open{display:block}
.vhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.vhead h2{font:600 20px/1.15 var(--serif);text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbody{padding:14px 14px calc(34px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.fld small{color:var(--muted);font-size:12.5px}
.vbody h3{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.srow{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;margin-bottom:6px}
.ico{width:40px;height:44px;border-radius:9px;border:1.5px solid var(--line);color:var(--muted);font-size:16px;background:var(--surface)}
details.box{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;margin-top:10px}
details.box summary{padding:12px 0;font-weight:600;cursor:pointer}
details.box[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details.box>*:last-child{margin-bottom:12px}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.danger-zone{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

/* Auswertung */
.rng{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.rng::-webkit-scrollbar{display:none}
.rng button{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.rng button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dates{display:flex;gap:8px;align-items:center;margin:2px 0 10px;font-size:14px;color:var(--muted)}
.dates input{flex:1}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
.stat{padding:9px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.stat b{display:block;font:600 24px/1.1 var(--serif)}
.stat span{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface2);position:sticky;top:0}
.tbl th button{font-weight:600;color:inherit;font-size:inherit;padding:2px 0}
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;text-align:left;background:var(--surface);border-right:1px solid var(--line);z-index:1}
.tbl th:first-child{background:var(--surface2);z-index:2}
.tbl td:first-child button{text-align:left;font-weight:600}
.tbl td:first-child small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.avg{display:inline-block;min-width:38px;padding:3px 7px;border-radius:6px;background:var(--c,var(--line));color:#fff;font-weight:700}
.dist{display:inline-flex;width:84px;height:10px;border-radius:5px;overflow:hidden;background:var(--line);vertical-align:middle}
.dist i{display:block;height:100%;background:var(--c)}
.none-list{display:flex;gap:6px;flex-wrap:wrap}
.none-list button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:14px}

/* Verlauf */
.spark{display:block;width:auto;max-width:100%;height:64px;margin:6px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.dh{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.ev{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:5px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ev .chip{flex:0 0 auto;min-width:30px;height:26px}
.ev .tx{flex:1;min-width:0;font-size:15px}
.ev .tx small{display:block;color:var(--muted);font-size:12.5px}
.ev .dt{position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;color:var(--muted);border-radius:8px;cursor:pointer}
.ev .dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.ev button{width:36px;height:36px;color:var(--muted);font-size:16px;border-radius:8px}

/* Zufall */
.pickbox{text-align:center;padding:26px 8px 10px}
.pickbox .fnb{font:600 clamp(38px,13vw,60px)/1.05 var(--serif);word-break:break-word}
.pickbox .lnb{font:400 clamp(20px,6vw,28px)/1.2 var(--serif);color:var(--muted);margin-top:4px;min-height:34px}
.pickbox .runde{font-size:13px;color:var(--muted);margin-top:14px}
.big{height:56px;font-size:18px}

code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);padding:1px 4px;border-radius:4px}
.btn:disabled{opacity:.45}
.seg.wide button{height:auto;min-height:38px;padding:6px 10px;line-height:1.2}

/* Einstellungen */
.sect{margin-bottom:22px}
.sect>h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.setrow small{display:block;color:var(--muted);font-size:12.5px}
.listrow{display:grid;grid-template-columns:1fr 40px;gap:6px;margin-bottom:6px}
.listrow.tag{grid-template-columns:1fr 78px 40px}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s}
input[type=checkbox].sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
input[type=checkbox].sw:checked{background:var(--r2)}
input[type=checkbox].sw:checked::after{transform:translateX(20px)}
.empty{text-align:center;padding:48px 20px}
.empty h2{font:600 24px/1.2 var(--serif);margin-bottom:8px}
.empty p{color:var(--muted);margin:0 0 18px}
.ccard{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--k,var(--line));border-radius:10px;margin-bottom:8px}
.ccard.on{outline:2px solid var(--k,var(--brand));outline-offset:-1px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw-c{width:34px;height:34px;border-radius:50%;background:var(--k);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.sw-c.on{box-shadow:0 0 0 3px var(--ink)}
.kbd{display:none}
.tile.picked{outline:3px solid var(--cc);outline-offset:-1px;background:color-mix(in srgb,var(--cc) 10%,var(--surface))}
.selbar,.ntsel{display:none}
.combo{position:relative;min-width:0;flex:1}
.cbox{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:38px;padding:3px 6px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);cursor:text}
.cbox:focus-within{outline:3px solid var(--brand);outline-offset:1px}
.cin{flex:1;min-width:130px;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);padding:5px 2px}
.cdrop{margin-left:auto;width:30px;height:30px;border-radius:7px;color:var(--muted);font-size:15px}
.cdrop:hover{background:var(--surface2)}
.cchip{display:inline-flex;align-items:center;gap:2px;background:var(--cc);color:#fff;border-radius:6px;padding:2px 2px 2px 8px;font-size:13px;font-weight:600;white-space:nowrap}
.cchip button{width:20px;height:20px;line-height:1;border-radius:5px;color:#fff;opacity:.85;font-size:14px}
.cchip button:hover{background:rgba(255,255,255,.25)}
.copts{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.25);max-height:320px;overflow:auto}
.copts li{padding:7px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.copts li small{color:var(--muted)}
.copts li.hi{background:var(--cc);color:#fff}
.copts li.hi small{color:#fff;opacity:.85}
.copts li.none{color:var(--muted);cursor:default}
.ntap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ntap .nap{height:34px;padding:0 4px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.ntap .nap .chip{min-width:34px;height:26px;font-size:14px}
.ntap .nap:disabled{opacity:.4}
.nt tr.picked td{background:color-mix(in srgb,var(--cc) 14%,var(--surface))}
.nt tr.picked td:first-child{box-shadow:inset 4px 0 0 var(--cc)}
/* Nachtragen */
.nt{border-collapse:separate;border-spacing:0;width:100%}
.nt th,.nt td{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.nt th{position:sticky;top:0;z-index:2;background:var(--surface2);padding:7px 2px}
.nt th:first-child,.nt td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:var(--surface);padding:3px 8px;border-right:1px solid var(--line);min-width:96px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.nt th:first-child{z-index:3;background:var(--surface2)}
.nt td:first-child b{font:600 15px/1.1 var(--serif);display:block;overflow:hidden;text-overflow:ellipsis}
.nt td:first-child small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.ntw{overflow:auto;max-height:calc(100vh - 195px);max-height:calc(100dvh - 195px);min-height:240px;border:1px solid var(--line);border-radius:8px;background:var(--surface);-webkit-overflow-scrolling:touch}
.nc{width:100%;min-width:34px;height:38px;border-radius:8px;color:var(--muted);font:600 16px/1 var(--ui)}
.nc.on{background:var(--ink);color:var(--bg);font-weight:700}
.nt-ctl{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.nt-ctl .fld{margin:0}
.vbody.wide{max-width:1100px}
.cols2{display:block}
/* Große Bildschirme */
@media (min-width:700px){
  .sheet{top:50%;bottom:auto;transform:translateY(-50%);border-radius:18px;max-height:88vh;animation:none;box-shadow:0 12px 48px rgba(0,0,0,.35)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(var(--tmin),1fr))}
  .vbody{max-width:820px}
  .vbody.wide{max-width:1100px}
}
@media (min-width:900px){
  #hdr{padding:calc(env(safe-area-inset-top) + 8px) 20px 8px}
  .hin{grid-template-columns:minmax(220px,1fr) minmax(300px,480px) minmax(220px,1fr);grid-template-areas:"c t d"}
  .datechip{justify-self:end}
  .tab{padding:8px 2px}
  #main{padding:14px 20px calc(var(--dockh) + 24px)}
  .tile{padding:9px 11px 8px 12px;gap:3px}
  .fn{font-size:20px}.ln{font-size:14px}
  #dock{padding:8px 20px}
  .dmain{display:flex;align-items:center;gap:18px;max-width:1400px;margin:0 auto}
  .stamps{flex:0 0 380px;margin:0}
  .xrow{flex-wrap:wrap;overflow:visible;padding:0}
  .dhint{max-width:1400px;margin:0 auto 4px}
  .kbd{display:inline}
  .selbar{display:block;margin:0 0 8px}
  .ntsel{display:block;margin-bottom:10px}
  .ntw{max-height:calc(100vh - 235px);max-height:calc(100dvh - 235px)}
  .tbar .sel{max-width:260px;flex:0 1 260px}
  .tbar{justify-content:flex-start}
  .tbar .seg{margin-left:auto}
  .cols2{column-count:2;column-gap:28px}
  .cols2 .sect{break-inside:avoid}
  .cols2 details.box{break-inside:avoid}
}
@media (min-width:1400px){.grid{--tmin:230px}.grid.c3{--tmin:180px}}
.ccard .go{flex:1;min-width:0;text-align:left}
.ccard .go b{display:block;font:600 19px/1.2 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .go small{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="main"></main>
<div id="dock"></div>
<div id="view" class="view" role="dialog" aria-modal="true"></div>
<div id="sheetWrap"><div class="backdrop" data-act="close"></div><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

/* ───────── Grundlagen ───────── */
var KEY='mitarbeit-app-v1';
var PAL=['#2F5FD0','#0E7C70','#2E7D32','#B45309','#C62828','#7C3AED','#C2185B','#546378'];
var ccol=function(c){return (c&&c.color)||PAL[0];};
var RATINGS=[
  {k:'r2', v:2,  sym:'++', name:'sehr gut'},
  {k:'r1', v:1,  sym:'+',  name:'gut'},
  {k:'r0', v:0,  sym:'○',  name:'mittel'},
  {k:'rm1',v:-1, sym:'−',  name:'schwach'},
  {k:'rm2',v:-2, sym:'−−', name:'sehr schwach'}
];
var byV=function(v){return RATINGS.filter(function(r){return r.v===v;})[0];};
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var uid=function(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);};
var p2=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
var todayStr=function(){return ymd(new Date());};
var WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function fmtDate(s,long){if(!s)return 'Ohne Datum';var d=new Date(s+'T12:00:00');return WD[d.getDay()]+' '+p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+(long?d.getFullYear():'');}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function fmtNum(x,dec){return x==null?'–':x.toFixed(dec==null?1:dec).replace('.',',');}
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── Daten ───────── */
var storageOK=true;
function defaults(){
  return {v:1,courses:[],events:[],settings:{
    activeCourse:null,cols:2,closeAfter:true,sort:'name',
    jokerReasons:['Fleiß','Hilfsbereitschaft','Gute Idee','Besondere Leistung'],
    tags:[{id:'t1',name:'HA fehlt',short:'HA'},{id:'t2',name:'Material fehlt',short:'Mat'},{id:'t3',name:'Störung',short:'St'}],
    lastBackup:null,backupSnooze:null
  }};
}
function normalize(s){
  var d=defaults();
  if(!s||typeof s!=='object') return d;
  s.courses=Array.isArray(s.courses)?s.courses:[];
  s.events=(Array.isArray(s.events)?s.events:[]).filter(function(e){return e&&e.type!=='absent'&&e.type!=='late';});
  s.settings=Object.assign(d.settings,s.settings||{});
  s.courses.forEach(function(c,i){
    c.color=c.color||PAL[i%PAL.length];
    c.students=Array.isArray(c.students)?c.students:[];
    c.jokerEvery=Math.max(1,parseInt(c.jokerEvery,10)||5);
    c.pickDone=Array.isArray(c.pickDone)?c.pickDone:[];
  });
  s.v=1;
  return s;
}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw) return normalize(JSON.parse(raw));}catch(e){storageOK=false;}
  return defaults();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}
}
var state=load();
try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}

/* Oberflächenzustand (wird nicht gespeichert) */
var ui={imp:null,nt:null,sel:[],cq:{class:'',nt:''},ch:{class:0,nt:0},copen:{class:false,nt:false},tab:'class',selDate:null,stamp:null,stampReason:'',sheet:null,view:null,draft:null,pick:null,flash:null,
        range:{p:'30',from:'',to:''},tsort:{k:'name',dir:1}};

var curDate=function(){return ui.selDate==null?todayStr():ui.selDate;};
function course(){
  var id=state.settings.activeCourse;
  var c=state.courses.filter(function(x){return x.id===id&&!x.archived;})[0];
  if(!c){c=state.courses.filter(function(x){return !x.archived;})[0]||null;state.settings.activeCourse=c?c.id:null;}
  return c;
}
function stu(sid){var c=course();return c?c.students.filter(function(s){return s.id===sid;})[0]:null;}
var fullName=function(s){return (s.first+' '+s.last).trim();};
function idxFor(cid){
  var m=new Map();
  state.events.forEach(function(e){if(e.cid!==cid)return;var a=m.get(e.sid);if(!a){a=[];m.set(e.sid,a);}a.push(e);});
  return m;
}
function evsOf(cid,sid){return state.events.filter(function(e){return e.cid===cid&&e.sid===sid;});}

function jokerInfo(evs,every){
  var pts=0,red=0;
  evs.forEach(function(e){if(e.type==='joker')pts+=(e.n||1);else if(e.type==='redeem')red++;});
  var earned=Math.floor(pts/every);
  return {pts:pts,earned:earned,red:red,avail:Math.max(0,earned-red),prog:pts%every,every:every};
}
function stats(evs,lo,hi){
  var o={n:0,sum:0,dist:[0,0,0,0,0],tags:{},jok:0,red:0,avg:null};
  evs.forEach(function(e){
    if(e.date?(e.date<lo||e.date>hi):!(lo==='0000-00-00'&&hi==='9999-99-99'))return;
    if(e.type==='rate'){o.n++;o.sum+=3-e.val;o.dist[2-e.val]++;}
    else if(e.type==='tag')o.tags[e.tag]=(o.tags[e.tag]||0)+1;
    else if(e.type==='joker')o.jok+=(e.n||1);
    else if(e.type==='redeem')o.red++;
  });
  o.avg=o.n?o.sum/o.n:null;
  return o;
}
function avgClass(avg){if(avg==null)return '';var i=Math.min(5,Math.max(1,Math.round(avg)))-1;return RATINGS[i].k;}

/* ───────── Ereignisse ───────── */
var seq=0;
function mkEvent(sid,type,extra){
  var d=curDate(),t=todayStr(),ts,bd=false;
  if(d===t){ts=Date.now();}
  else{ts=(d?new Date(d+'T12:00:00').getTime():0)+(seq++%40000)*1000;bd=true;}
  var ev={id:uid(),cid:course().id,sid:sid,ts:ts,date:d,type:type};
  if(bd)ev.bd=1;
  return Object.assign(ev,extra||{});
}
function toast(msg,undo,gold){
  var t=$('#toast');
  t.className=gold?'show gold':'show';
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">Rückgängig</button>':'');
  toast.undo=undo||null;
  clearTimeout(toast.timer);
  toast.timer=setTimeout(function(){t.className='';toast.undo=null;},undo?5500:2800);
}
function toastUndoIds(msg,ids,gold){
  toast(msg,function(){state.events=state.events.filter(function(e){return ids.indexOf(e.id)<0;});save();afterChange();},gold);
}
function jInfoNow(c,sid){return jokerInfo(evsOf(c.id,sid),c.jokerEvery);}

function doStamp(key,sid,opt){
  opt=opt||{};
  var TU=opt.quiet?function(){}:toastUndoIds;
  var c=course(),s=stu(sid);
  if(!c||!s)return false;
  var rt=RATINGS.filter(function(r){return r.k===key;})[0];
  var ev;
  if(rt){
    ev=mkEvent(sid,'rate',{val:rt.v});state.events.push(ev);save();
    TU(s.first+': '+rt.sym+' '+rt.name,[ev.id]);return true;
  }
  if(key==='joker'){
    var before=jInfoNow(c,sid);
    ev=mkEvent(sid,'joker',opt.reason?{reason:opt.reason}:{});state.events.push(ev);save();
    var got=jInfoNow(c,sid).earned>before.earned;
    TU(s.first+': ★ Joker-Punkt'+(opt.reason?' ('+opt.reason+')':'')+(got?' – Joker erreicht!':''),[ev.id],got);return true;
  }
  if(key==='redeem'){
    if(jInfoNow(c,sid).avail<1){toast(s.first+' hat keinen Joker zum Einlösen');return false;}
    ev=mkEvent(sid,'redeem');state.events.push(ev);save();
    TU(s.first+': Joker eingelöst',[ev.id]);return true;
  }
  if(key.indexOf('tag:')===0){
    var t=state.settings.tags.filter(function(x){return x.id===key.slice(4);})[0];
    if(!t)return false;
    ev=mkEvent(sid,'tag',{tag:t.id,tn:t.name,sh:t.short||t.name.slice(0,3)});state.events.push(ev);save();
    TU(s.first+': '+t.name,[ev.id]);return true;
  }
  return false;
}
function flash(sid){ui.flash=sid;afterChange();ui.flash=null;}
function setEventDate(id,val){
  var e=state.events.filter(function(x){return x.id===id;})[0];
  if(!e||(e.date||'')===val)return;
  var old={date:e.date,ts:e.ts,bd:e.bd};
  e.date=val;e.bd=1;
  e.ts=(val?new Date(val+'T12:00:00').getTime():0)+(seq++%40000)*1000;
  save();afterChange();
  toast(val?'Datum geändert: '+fmtDate(val,true):'Datum entfernt',function(){e.date=old.date;e.ts=old.ts;if(old.bd)e.bd=old.bd;else delete e.bd;save();afterChange();});
}
function removeEvent(id){
  var i=state.events.findIndex(function(e){return e.id===id;});
  if(i<0)return;
  var ev=state.events.splice(i,1)[0];save();afterChange();
  toast('Eintrag gelöscht',function(){state.events.push(ev);save();afterChange();});
}

/* ───────── Namenssuche mit Mehrfachauswahl (PC) ───────── */
var nrm=function(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();};
function comboIds(ctx){return ctx==='nt'?ui.nt.sel:ui.sel;}
function comboCourse(ctx){return ctx==='nt'?state.courses.filter(function(c){return c.id===ui.nt.cid;})[0]:course();}
function comboMatches(ctx,q,all){
  var c=comboCourse(ctx),ids=comboIds(ctx);if(!c)return [];
  var toks=nrm(q).split(/\s+/).filter(Boolean);
  var list=c.students.filter(function(s){return ids.indexOf(s.id)<0;});
  if(toks.length)list=list.filter(function(s){var w=nrm(s.first+' '+s.last).split(/\s+/);return toks.every(function(t){return w.some(function(x){return x.indexOf(t)===0;});});});
  list.sort(function(a,b){return (a.last+' '+a.first).localeCompare(b.last+' '+b.first,'de');});
  return all?list:list.slice(0,12);
}
function comboHTML(ctx){
  return '<div class="combo" data-ctx="'+ctx+'"><div class="cbox" data-act="cfocus" data-ctx="'+ctx+'"><span class="cchips"></span><input class="cin" data-ctx="'+ctx+'" placeholder="Namen suchen, mehrere wählen … (/)" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-label="Namen suchen"><button class="cdrop" data-act="ctoggle" data-ctx="'+ctx+'" aria-label="Alle Namen anzeigen" tabindex="-1">▾</button></div><ul class="copts" role="listbox" hidden></ul></div>';
}
function comboRender(ctx){
  var box=document.querySelector('.combo[data-ctx="'+ctx+'"]');if(!box)return;
  var c=comboCourse(ctx),ids=comboIds(ctx),chips='';
  ids.forEach(function(id){var st=c&&c.students.filter(function(x){return x.id===id;})[0];if(st)chips+='<span class="cchip">'+esc(fullName(st))+'<button data-act="cdel" data-ctx="'+ctx+'" data-id="'+id+'" aria-label="Entfernen">✕</button></span>';});
  box.querySelector('.cchips').innerHTML=chips;
  var ul=box.querySelector('.copts'),inp=box.querySelector('.cin');
  var m=ui.copen[ctx]?comboMatches(ctx,ui.cq[ctx]):[];
  ui.ch[ctx]=Math.min(ui.ch[ctx],Math.max(0,m.length-1));
  if(!ui.copen[ctx]){ul.hidden=true;inp.setAttribute('aria-expanded','false');return;}
  ul.innerHTML=m.length?m.map(function(st,i){return '<li role="option" class="'+(i===ui.ch[ctx]?'hi':'')+'" data-act="cpick" data-ctx="'+ctx+'" data-id="'+st.id+'"><span>'+esc(st.first)+' <b>'+esc(st.last)+'</b></span></li>';}).join(''):'<li class="none">Keine weiteren Treffer</li>';
  ul.hidden=false;inp.setAttribute('aria-expanded','true');
  var hi=ul.querySelector('.hi');if(hi&&hi.scrollIntoView)hi.scrollIntoView({block:'nearest'});
}
function comboChanged(ctx){
  comboRender(ctx);
  if(ctx==='nt'){ntMarkSel();}
  else{Array.prototype.forEach.call(document.querySelectorAll('.tile'),function(t){t.classList.toggle('picked',ui.sel.indexOf(t.dataset.sid)>=0);});renderDock();}
}
function comboAdd(ctx,sid){var ids=comboIds(ctx);if(ids.indexOf(sid)<0)ids.push(sid);}
function comboToggle(ctx,sid){var ids=comboIds(ctx),i=ids.indexOf(sid);if(i<0)ids.push(sid);else ids.splice(i,1);comboChanged(ctx);}
/* Enter: markierten Treffer übernehmen, bei „Anna, Ben; Clara“ alle genannten Namen */
function comboCommit(ctx){
  var q=ui.cq[ctx],parts=q.split(/[,;\n]/).map(function(x){return x.trim();}).filter(Boolean);
  if(parts.length>1){parts.forEach(function(pt){var m=comboMatches(ctx,pt,true);if(m.length)comboAdd(ctx,m[0].id);});}
  else{var m1=comboMatches(ctx,q);if(m1.length)comboAdd(ctx,m1[Math.min(ui.ch[ctx],m1.length-1)].id);else return false;}
  ui.cq[ctx]='';ui.ch[ctx]=0;ui.copen[ctx]=false;
  var inp=document.querySelector('.cin[data-ctx="'+ctx+'"]');if(inp)inp.value='';
  comboChanged(ctx);return true;
}
function selClear(ctx){comboIds(ctx).length=0;ui.cq[ctx]='';var inp=document.querySelector('.cin[data-ctx="'+ctx+'"]');if(inp)inp.value='';comboChanged(ctx);}
function applySel(k){
  var ids=ui.sel.slice(),n0=state.events.length,ok=0,opt={quiet:1,reason:ui.stampReason};
  if(!ids.length)return;
  ids.forEach(function(sid){if(doStamp(k,sid,opt))ok++;});
  var evIds=state.events.slice(n0).map(function(e){return e.id;});
  ui.sel=[];ui.cq.class='';ui.copen.class=false;ui.focusCombo=true;
  toastUndoIds(ok+(ok===1?' Person: ':' Personen: ')+stampLabel(k),evIds);
  afterChange();
}
/* Tastatur im Suchfeld */
function comboKey(e,inp){
  var ctx=inp.dataset.ctx,m;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();ui.copen[ctx]=true;m=comboMatches(ctx,ui.cq[ctx]);
    if(m.length)ui.ch[ctx]=(ui.ch[ctx]+(e.key==='ArrowDown'?1:-1)+m.length)%m.length;
    comboRender(ctx);
  }else if(e.key==='Enter'){
    e.preventDefault();
    if(!comboCommit(ctx)&&ctx==='class'&&ui.sel.length&&!ui.cq[ctx])toast('Wertung wählen (Taste 1–5 oder Stempelleiste)');
  }else if(e.key==='Escape'){
    e.preventDefault();
    if(ui.cq[ctx]){ui.cq[ctx]='';inp.value='';ui.ch[ctx]=0;comboRender(ctx);}
    else if(comboIds(ctx).length)selClear(ctx);
    else{ui.copen[ctx]=false;comboRender(ctx);inp.blur();}
  }else if(e.key==='Backspace'&&!inp.value){

function sortStudents(c,idx){
  var list=c.students.slice();
  var nm=function(s){return (s.last+' '+s.first).toLowerCase();};
  var mode=state.settings.sort;
  if(mode==='first')list.sort(function(a,b){return (a.first+' '+a.last).localeCompare(b.first+' '+b.last,'de');});
  else if(mode==='long'){
    var last=function(s){var m=0;(idx.get(s.id)||[]).forEach(function(e){if(e.type==='rate'&&e.ts>m)m=e.ts;});return m;};
    list.sort(function(a,b){return last(a)-last(b)||nm(a).localeCompare(nm(b),'de');});
  }
  else list.sort(function(a,b){return nm(a).localeCompare(nm(b),'de');});
  return list;
}
function backupDue(){
  var s=state.settings,now=Date.now();
  if(state.events.length<15)return null;
  if(s.backupSnooze&&now<s.backupSnooze)return null;
  if(!s.lastBackup)return 'noch nie';
  var days=Math.floor((now-s.lastBackup)/864e5);
  return days>=14?'vor '+days+' Tagen':null;
}
function tileHTML(s,evs,c,d,cols){
  var day=evs.filter(function(e){return e.date===d;}).sort(function(a,b){return a.ts-b.ts;});
  var rates=day.filter(function(e){return e.type==='rate';});
  var lastR=rates[rates.length-1];
  var tc=lastR?'var(--'+byV(lastR.val).k+')':'';
  var jk=jokerInfo(evs,c.jokerEvery);
  var items=[],said=[],jN=0,jTs=0;
  day.forEach(function(e){
    if(e.type==='rate'){var r=byV(e.val);items.push({ts:e.ts,h:'<i class="chip '+r.k+'{NW}">'+r.sym+'</i>'});said.push(r.sym);}
    else if(e.type==='joker'){jN+=(e.n||1);jTs=e.ts;said.push('Joker-Punkt');}
    else if(e.type==='redeem'){items.push({ts:e.ts,h:'<i class="chip jk{NW}">−J</i>'});said.push('Joker eingelöst');}
    else if(e.type==='tag'){items.push({ts:e.ts,h:'<i class="chip tg{NW}">'+esc(e.sh||e.tn||'?')+'</i>'});said.push(e.tn||'Marker');}
  });
  if(jN)items.push({ts:jTs,h:'<i class="chip jk{NW}">★'+(jN>1?jN:'')+'</i>'});
  items.sort(function(a,b){return a.ts-b.ts;});
  var max=cols===3?3:4,chips=[];
  var room=Math.max(1,max-chips.length),hidden=Math.max(0,items.length-room),vis=items.slice(hidden);
  if(hidden)chips.push('<i class="chip more">+'+hidden+'</i>');
  vis.forEach(function(it,i){chips.push(it.h.replace('{NW}',i===vis.length-1?' nw':''));});
  var pips='',maxPips=cols===3?6:8;
  if(c.jokerEvery<=maxPips){for(var i=0;i<c.jokerEvery;i++)pips+='<span class="pip'+(i<jk.prog?' f':'')+'"></span>';}
  else pips='★ '+jk.prog+'/'+c.jokerEvery;
  var label=fullName(s)+(said.length?', heute: '+said.join(', '):'')+', Joker-Punkte '+jk.prog+' von '+c.jokerEvery+(jk.avail?', '+jk.avail+' Joker verfügbar':'');
  return '<button class="tile'+(ui.sel.indexOf(s.id)>=0?' picked':'')+(ui.flash===s.id?' flash':'')+'" data-act="tile" data-sid="'+s.id+'"'+(tc?' style="--tc:'+tc+'"':'')+' aria-label="'+esc(label)+'">'+
    '<span class="fn">'+esc(s.first||s.last)+'</span>'+
    '<span class="lrow"><span class="ln">'+esc(s.first?s.last:'')+'&nbsp;</span><span class="pips" aria-hidden="true">'+pips+'</span></span>'+
    '<span class="chips">'+chips.join('')+(jk.avail?'<span class="jb" aria-hidden="true"><span class="jl">Joker </span>'+jk.avail+'</span>':'')+'</span>'+
  '</button>';
}

function rangeBounds(){
  var t=todayStr(),r=ui.range;
  if(r.p==='today')return [t,t];
  if(r.p==='7')return [addDays(t,-6),t];
  if(r.p==='30')return [addDays(t,-29),t];
  if(r.p==='all')return ['0000-00-00','9999-99-99'];
  return [r.from||'0000-00-00',r.to||'9999-99-99'];
}
function evalRows(c){
  var idx=idxFor(c.id),b=rangeBounds();
  return c.students.map(function(s){var evs=idx.get(s.id)||[];return {s:s,st:stats(evs,b[0],b[1]),jk:jokerInfo(evs,c.jokerEvery)};});
}
function sortRows(rows){
  var k=ui.tsort.k,dir=ui.tsort.dir;
  var G=function(r){
    if(k==='name')return (r.s.last+' '+r.s.first).toLowerCase();
    if(k==='avg')return r.st.avg;
    if(k==='n')return r.st.n;
    if(k==='jp')return r.jk.pts;
    if(k==='ja')return r.jk.avail;
    if(k.indexOf('tag:')===0)return r.st.tags[k.slice(4)]||0;
    return 0;
  };
  rows.sort(function(a,b){
    var x=G(a),y=G(b);
    if(k==='avg'){if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;}
    if(typeof x==='string')return x.localeCompare(y,'de')*dir;
    return (x-y)*dir;
  });
  return rows;
}

  html+='<p class="hint" style="margin-top:12px">Ø Tendenz: ++ = 1, + = 2, ○ = 3, − = 4, −− = 5. Das ist eine Orientierung, keine Note. Tippe auf einen Namen für den Verlauf.</p>';
  html+='<div class="tw"><table class="tbl"><thead><tr>'+th('name','Name')+th('avg','Ø')+th('n','Bew.')+'<th>Verteilung</th>'+th('jp','Joker-P.')+th('ja','Joker')+tags.map(function(t){return th('tag:'+t.id,esc(t.name));}).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){
      var dist=r.st.n?'<span class="dist" title="Verteilung der Bewertungen">'+r.st.dist.map(function(n,i){return n?'<i class="'+RATINGS[i].k+'" style="flex:'+n+'"></i>':'';}).join('')+'</span>':'–';

        tags.map(function(t){return '<td>'+(r.st.tags[t.id]||'–')+'</td>';}).join('')+'</tr>';
    }).join('')+'</tbody></table></div>';
  var und=state.events.filter(function(e){return e.cid===c.id&&!e.date;}).length;
  if(und)html+='<p class="hint" style="margin-top:8px">'+und+' Einträge ohne Datum zählen nur bei „Alles“. Das Datum lässt sich im Verlauf der Person nachtragen.</p>';

  return html;
}

var impNorm=function(s){return String(s||'').normalize('NFC').toLowerCase().replace(/[.,;:]+/g,' ').replace(/\s+/g,' ').trim();};
var impKey=function(s){return impNorm(s).split(' ').filter(Boolean).sort().join(' ');};
var NUMCELL=/^(\d+|[-−–—]?)$/;
var SUMCOLS=['++','+','o','-','--','j'];
var MAXN=500;

/* Datum in einer Zeile finden: 31.12.2026, 31.12.26, 31.12. (Jahr ergänzt) oder 2026-12-31 */
function findDate(line,defDate){
  var m=/(^|[^\d.])(\d{4})-(\d{1,2})-(\d{1,2})(?!\d)/.exec(line),y,mo,d,rest,bad=false;
  if(m){y=+m[2];mo=+m[3];d=+m[4];rest=line.replace(m[0],m[1]+' ');}
  else{
    m=/(^|[^\d.])(\d{1,2})\.\s?(\d{1,2})\.(\d{4}|\d{2})?(?!\d)/.exec(line);
    if(!m)return null;
    mo=+m[3];d=+m[2];
    rest=line.replace(m[0],m[1]+' ');
    if(m[4])y=m[4].length===2?2000+(+m[4]):+m[4];
    else{
      y=+(defDate||todayStr()).slice(0,4);
      if(ymd(new Date(y,mo-1,d))>todayStr())y--;
    }
  }
  var t=new Date(y,mo-1,d);
  if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return {bad:true};
  return {date:ymd(t),rest:rest.replace(/\s{2,}/g,' ').trim()};
}
/* Wörter mit Leerzeichen zu einem Token zusammenfassen */
function impPrep(str,tags){
  var s=' '+str.replace(/[−–—]/g,'-')+' ';
  s=s.replace(/(\s)sehr\s+gut(?=\s|$)/gi,'$1++').replace(/(\s)sehr\s+schwach(?=\s|$)/gi,'$1--')
     .replace(/(\s)joker\s+eingel(?:ö|oe)st(?=\s|$)/gi,'$1-J').replace(/(\s)joker[\s-]*punkte?(?=\s|$)/gi,'$1J');
  tags.slice().sort(function(a,b){return b.name.length-a.name.length;}).forEach(function(t){
    if(!t.name||!/\s/.test(t.name))return;
    s=s.replace(new RegExp('(\\s)'+t.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'(?=\\s|$)','gi'),'$1tag:'+t.id);
  });
  return s.trim();
}
function baseTok(low,tags){
  var m;
  if(low==='++'||low==='sehr gut')return {type:'rate',val:2};
  if(low==='+'||low==='gut')return {type:'rate',val:1};
  if(low==='o'||low==='○'||low==='0'||low==='='||low==='mittel')return {type:'rate',val:0};
  if(low==='-'||low==='schwach')return {type:'rate',val:-1};
  if(low==='--'||low==='sehr schwach')return {type:'rate',val:-2};
  if(/^[1-5]$/.test(low))return {type:'rate',val:3-(+low)};
  if(/^(j|jp|★|☆|\*|joker|jokerpunkte?)$/.test(low))return {type:'joker'};
  if(/^(-j|jokereingel(ö|oe)st|eingel(ö|oe)st)$/.test(low))return {type:'redeem'};
  if((m=/^tag:(.+)$/.exec(low))){var t0=tags.filter(function(x){return x.id.toLowerCase()===m[1];})[0];if(t0)return {type:'tag',tag:t0.id,tn:t0.name,sh:t0.short||t0.name.slice(0,3)};}
  var t=tags.filter(function(x){var n=x.name.toLowerCase(),sh=(x.short||'').toLowerCase();return low===n||(sh&&low===sh);})[0];
  if(t)return {type:'tag',tag:t.id,tn:t.name,sh:t.short||t.name.slice(0,3)};
  return null;
}
/* „3x+“, „2×★“ oder „+x3“ = mehrfach */
function valTok(tok,tags){
  var t=tok.trim(),n=1,m=/^(\d{1,3})\s*[x×]\s*(.+)$/i.exec(t);
  if(m){n=+m[1];t=m[2];}
  else if((m=/^(.+?)\s*[x×]\s*(\d{1,3})$/i.exec(t))){n=+m[2];t=m[1];}
  var b=baseTok(t.toLowerCase(),tags);
  if(!b)return null;
  b.n=n;return b;
}
function colKind(cell,tags){
  var c=impPrep(cell,tags),low=c.toLowerCase();
  if(/^(name|vorname|nachname|sch(ü|ue)ler(:?in)?|sch(ü|ue)ler\/?in(nen)?)$/.test(low))return 'name';
  if(/^(\d+)$/.test(low))return null;
  var b=baseTok(low,tags);
  return b;
}
/* Name → vorhandene Schüler:in (Reihenfolge von Vor- und Nachname egal) oder neu */
function makeResolver(c,create){
  var byKey={},byTok={},added=[],addedKey={};
  c.students.forEach(function(s){
    var k=impKey(s.first+' '+s.last);(byKey[k]=byKey[k]||[]).push(s);
    [s.first,s.last].forEach(function(p){var k2=impKey(p);if(k2&&k2.indexOf(' ')<0)(byTok[k2]=byTok[k2]||[]).push(s);});
  });
  var res=function(parts){
    var raw=parts.join(' '),k=impKey(raw);
    if(!k)return {err:'Kein Name'};
    var hit=byKey[k];
    if(!hit&&k.indexOf(' ')<0)hit=byTok[k];
    if(hit&&hit.length===1)return {sid:hit[0].id};
    if(hit&&hit.length>1)return {err:'Name nicht eindeutig: '+raw};
    if(addedKey[k])return {sid:addedKey[k].id};
    if(!create)return {err:'Unbekannter Name: '+raw};
    var f,l;
    if(parts.length>1){f=parts[0];l=parts.slice(1).join(' ');}
    else if(raw.indexOf(',')>-1){var m=raw.split(',');l=m[0].trim();f=m.slice(1).join(' ').trim();}
    else{var p=raw.split(/\s+/);if(p.length===1){f=p[0];l='';}else{l=p.pop();f=p.join(' ');}}
    var s={id:uid(),first:f,last:l};
    added.push(s);addedKey[k]=s;
    return {sid:s.id};
  };
  res.added=added;
  return res;
}
/* Eine Zeile in Name-Teile und Wertungs-Tokens zerlegen */
function splitLine(line,tags){
  var fields=/[\t;]/.test(line)?line.split(/\t|;/):[line],name=[],vals=[],bad=null;
  fields.forEach(function(f){
    f=f.trim();if(!f)return;
    var tk=f.split(/\s+/),vs=tk.map(function(t){return valTok(t,tags);});
    if(vs.every(Boolean)){vals=vals.concat(vs);return;}
    var a=0,b=tk.length;
    while(b>a+1&&vs[b-1])b--;
    if(b===tk.length)while(a<b-1&&vs[a])a++;
    vals=vals.concat(vs.slice(b).filter(Boolean),vs.slice(0,a).filter(Boolean));
    name.push(tk.slice(a,b).join(' '));
  });
  return {name:name,vals:vals};
}
function pushVal(rows,sid,date,v,n){
  var ev={sid:sid,date:date,type:v.type};
  if(v.type==='rate')ev.val=v.val;
  if(v.type==='tag'){ev.tag=v.tag;ev.tn=v.tn;ev.sh=v.sh;}
  if(v.type==='joker'){ev.n=n;rows.push(ev);return;}
  for(var i=0;i<n;i++)rows.push(Object.assign({},ev));
}
function buildImport(o,c){
  var tags=state.settings.tags,defDate=o.date||'',curD=defDate,rows=[],probs=[],lines=0,rs=makeResolver(c,o.create);
  var cols=null;
  String(o.text||'').split(/\r?\n/).forEach(function(raw,ln){
    var line=raw.trim();if(!line)return;
    var bad=function(m){probs.push({ln:ln+1,t:raw.trim(),m:m});};
    var di=findDate(line,defDate),d=curD;
    if(di&&di.bad)return bad('Ungültiges Datum');
    if(di){line=di.rest;d=di.date;if(!line){curD=di.date;return;}}
    line=impPrep(line,tags);
    if(o.mode==='entries'){
      var sp=splitLine(line,tags);
      if(!sp.vals.length)return bad('Keine Wertung erkannt');
      var r=rs(sp.name);if(r.err)return bad(r.err);
      lines++;
      sp.vals.forEach(function(v){
        if(v.n>MAXN)return bad('Zu viele Wiederholungen');
        pushVal(rows,r.sid,d,v,v.n);
      });
      return;
    }
    /* Summen: Kopfzeile (optional), danach Name + Zahlen */
    var cells=/[\t;]/.test(line)?line.split(/\t|;/).map(function(x){return x.trim();}):line.split(/\s+/);
    var kinds=cells.map(function(x){return colKind(x,tags);});
    var named=kinds.filter(function(k){return k&&k!=='name';});
    if(!cols&&named.length>=2&&!cells.some(function(x){return /^\d+$/.test(x);})){
      cols=kinds.filter(function(k){return k!=='name';});
      return;
    }
    var i=0,nm=[];
    while(i<cells.length&&!NUMCELL.test(cells[i])){nm.push(cells[i]);i++;}
    var nums=cells.slice(i);
    if(!nm.length)return bad('Kein Name');
    if(!nums.some(function(x){return /^\d+$/.test(x);}))return bad('Keine Zahlen erkannt');
    var colList=cols||SUMCOLS.map(function(k){return baseTok(k,tags);}).concat(tags.map(function(t){return baseTok('tag:'+t.id,tags);}));
    if(nums.length>colList.length)return bad('Mehr Zahlen als Spalten ('+colList.length+')');
    var r2=rs(nm.length>1&&!/[\t;]/.test(line)?[nm.join(' ')]:nm);if(r2.err)return bad(r2.err);
    var ok=true;
    nums.forEach(function(x,j){
      var n=/^\d+$/.test(x)?+x:0;
      if(!n)return;
      if(n>MAXN){ok=false;return bad('Zahl zu groß: '+x);}
      if(colList[j])pushVal(rows,r2.sid,d,colList[j],n);
    });
    if(ok)lines++;
  });
  return {rows:rows,added:rs.added,probs:probs,lines:lines};
}

    d.pickDone=(d.pickDone||[]).filter(function(id){return keep.has(id);});
    state.courses[i]=d;
    if(d.archived&&state.settings.activeCourse===d.id)state.settings.activeCourse=null;
  }
  save();ui.view=null;ui.draft=null;renderView();render();toast('Kurs gespeichert');
}

/* ───────── Export & Sicherung ───────── */
function csvCell(v){v=v==null?'':String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(rows){return '﻿'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\r\n');}
var slug=function(s){return String(s).replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,'_').replace(/^_+|_+$/g,'')||'Kurs';};
function saveFile(name,mime,text){
  var blob=new Blob([text],{type:mime});
  try{
    var file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:name}).then(function(){return true;},function(e){if(e&&e.name==='AbortError')return false;return dl();});
    }
  }catch(e){}
  return Promise.resolve(dl());
  function dl(){
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    return true;
  }
}
function exportEval(){
  var c=course();if(!c)return;
  var tags=state.settings.tags,rows=sortRows(evalRows(c));
  var b=rangeBounds();
  var head=['Nachname','Vorname','Ø Tendenz (1–5)','Bewertungen','sehr gut','gut','mittel','schwach','sehr schwach','Joker-Punkte gesamt','Joker verfügbar','Joker eingelöst'].concat(tags.map(function(t){return t.name;}));
  var data=[head].concat(rows.map(function(r){
    return [r.s.last,r.s.first,r.st.avg==null?'':fmtNum(r.st.avg,2),r.st.n].concat(r.st.dist,[r.jk.pts,r.jk.avail,r.jk.red],tags.map(function(t){return r.st.tags[t.id]||0;}));
  }));
  saveFile('Mitarbeit_'+slug(c.name)+'_'+todayStr()+'.csv','text/csv;charset=utf-8',toCSV(data));
}
function exportLog(){
  var c=course();if(!c)return;
  var b=rangeBounds(),names={};c.students.forEach(function(s){names[s.id]=s;});
  var evs=state.events.filter(function(e){return e.cid===c.id&&(e.date?(e.date>=b[0]&&e.date<=b[1]):(b[0]==='0000-00-00'&&b[1]==='9999-99-99'))&&names[e.sid];}).sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:x.ts-y.ts;});
  var rows=[['Datum','Uhrzeit','Nachname','Vorname','Art','Wert','Note-Äquivalent','Grund / Notiz']];
  evs.forEach(function(e){
    var s=names[e.sid],dt=e.date.split('-').reverse().join('.'),tm=e.bd?'':p2(new Date(e.ts).getHours())+':'+p2(new Date(e.ts).getMinutes());
    var art='',val='',eq='',txt='';
    if(e.type==='rate'){var r=byV(e.val);art='Mitarbeit';val=r.name;eq=3-e.val;}
    else if(e.type==='joker'){art='Joker-Punkt';val=e.n||1;txt=e.reason||'';}
    else if(e.type==='redeem')art='Joker eingelöst';
    else if(e.type==='tag')art=e.tn||'Marker';
    else if(e.type==='note'){art='Notiz';txt=e.note||'';}
    else art=e.type;
    rows.push([dt,tm,s.last,s.first,art,val,eq,txt]);
  });
  saveFile('Mitarbeit_Protokoll_'+slug(c.name)+'_'+todayStr()+'.csv','text/csv;charset=utf-8',toCSV(rows));
}
function backupNow(){
  var name='Mitarbeit_Sicherung_'+todayStr()+'.json';
  Promise.resolve(saveFile(name,'application/json',JSON.stringify(state,null,1))).then(function(ok){
    if(ok===false)return;
    state.settings.lastBackup=Date.now();save();render();toast('Sicherung gespeichert');
  });
}
function importBackup(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var s=JSON.parse(r.result);
      if(!s||!Array.isArray(s.courses)||!Array.isArray(s.events))throw new Error('format');
      if(!confirm('Sicherung mit '+s.courses.length+' Kurs(en) und '+s.events.length+' Einträgen laden? Die aktuellen Daten auf diesem Gerät werden ersetzt.'))return;
      state=normalize(s);save();ui.view=null;ui.draft=null;ui.pick=null;ui.stamp=null;renderView();render();toast('Sicherung geladen');
    }catch(e){alert('Diese Datei ist keine gültige Sicherung.');}
  };
  r.readAsText(file);
}

/* ───────── Aktionen ───────── */
var A={
  tab:function(el){ui.tab=el.dataset.t;if(ui.tab!=='class')ui.stamp=null;render();window.scrollTo(0,0);},
  today:function(){ui.selDate=null;afterChange();},
  dateSheet:function(){openSheet({type:'date'});},
  dset:function(el){ui.selDate=el.dataset.m==='none'?'':null;closeSheet();afterChange();},
  courseSwitch:function(){openSheet({type:'course'});},
  setCourse:function(el){
    ui.sel=[];
    state.settings.activeCourse=el.dataset.id;save();ui.stamp=null;closeSheet();
    if(el.dataset.go)ui.tab='class';
    render();window.scrollTo(0,0);
  },
  gotoCourses:function(){closeSheet();ui.tab='courses';render();},
  newCourse:newCourse,
  editCourse:function(el){editCourse(el.dataset.id);},
  tile:function(el,e){
    var sid=el.dataset.sid;
    if(e&&(e.ctrlKey||e.metaKey||e.shiftKey)){comboToggle('class',sid);return;}
    if(ui.stamp){if(doStamp(ui.stamp,sid,{reason:ui.stampReason}))flash(sid);}
    else openSheet({type:'student',sid:sid});
  },
  stamp:function(el){
    if(ui.sel.length&&ui.tab==='class'){applySel(el.dataset.k);return;}
    ui.stamp=ui.stamp===el.dataset.k?null:el.dataset.k;if(ui.stamp!=='joker')ui.stampReason='';renderDock();},
  stampOff:function(){ui.stamp=null;ui.stampReason='';renderDock();},
  cols:function(el){state.settings.cols=+el.dataset.n===3?3:2;save();render();},
  close:function(){closeSheet();},
  undo:function(){var f=toast.undo;if(f){toast.undo=null;$('#toast').className='';f();}},
  srate:function(el){var sid=ui.sheet.sid;if(doStamp(el.dataset.k,sid)){afterChange();sheetDone();}},
  sjoker:function(el){var sid=ui.sheet.sid;if(doStamp('joker',sid,{reason:el.dataset.r})){afterChange();sheetDone();}},
  sredeem:function(){var sid=ui.sheet.sid;if(doStamp('redeem',sid)){afterChange();sheetDone();}},
  stag:function(el){var sid=ui.sheet.sid;if(doStamp('tag:'+el.dataset.id,sid)){afterChange();sheetDone();}},
  snote:function(){
    var n=$('#noteTxt'),txt=n?n.value.trim():'';
    if(!txt){toast('Bitte zuerst eine Notiz eingeben.');return;}
    var sid=ui.sheet.sid,s=stu(sid),ev=mkEvent(sid,'note',{note:txt});
    state.events.push(ev);save();n.value='';afterChange();toastUndoIds(s.first+': Notiz gespeichert',[ev.id]);sheetDone();
  },
  delev:function(el){removeEvent(el.dataset.id);},
  detail:function(el){openDetail(el.dataset.sid);},
  closeView:function(){closeView();},
  /* Zufall */
  pick:startPick,
  pnext:function(){
    var r=drawPick();if(!r)return;
    ui.pick={sid:r.s.id,called:r.called,total:r.total,fresh:r.fresh,rated:null,spinning:false};renderView();
  },
  prate:function(el){
    var p=ui.pick;if(!p||p.rated)return;
    var r=RATINGS.filter(function(x){return x.k===el.dataset.k;})[0];
    if(doStamp(el.dataset.k,p.sid)){p.rated=r.sym+' '+r.name;afterChange();}
  },
  pjoker:function(){var p=ui.pick;if(p&&doStamp('joker',p.sid)){afterChange();}},
  presetround:function(){var c=course();c.pickDone=ui.pick?[ui.pick.sid]:[];save();if(ui.pick){var el=eligible(c);ui.pick.called=1;ui.pick.total=el.length;ui.pick.fresh=true;}renderView();toast('Neue Runde gestartet');},
  /* Kurs-Editor */
  addStudent:function(){
    ui.draft.students.push({id:uid(),first:'',last:''});
    $('#stuList').innerHTML=stuRows();$('#stuCount').textContent=ui.draft.students.length;
    var inputs=document.querySelectorAll('#stuList [data-bind="sfirst"]');if(inputs.length)inputs[inputs.length-1].focus();
  },
  delStudent:function(el){
    ui.draft.students.splice(+el.dataset.i,1);
    $('#stuList').innerHTML=stuRows();$('#stuCount').textContent=ui.draft.students.length;
  },
  sortStudents:function(){
    ui.draft.students.sort(function(a,b){return (a.last+' '+a.first).localeCompare(b.last+' '+b.first,'de');});
    $('#stuList').innerHTML=stuRows();
  },
  pasteStudents:function(){
    var t=$('#pasteTxt'),list=parseStudents(t.value);
    if(!list.length){toast('Keine Namen gefunden.');return;}
    ui.draft.students=ui.draft.students.concat(list);
    $('#stuList').innerHTML=stuRows();$('#stuCount').textContent=ui.draft.students.length;
    t.value='';toast(list.length+' Schüler:in(nen) hinzugefügt – mit „Speichern“ übernehmen');
  },
  courseSave:courseSave,
  setColor:function(el){
    ui.draft.color=el.dataset.c;
    Array.prototype.forEach.call(document.querySelectorAll('.sw-c'),function(b){var on=b.dataset.c===ui.draft.color;b.classList.toggle('on',on);b.setAttribute('aria-checked',on);});
  },
  courseCancel:function(){closeView();},
  archiveCourse:function(){ui.draft.archived=!ui.draft.archived;courseSave();},
  deleteCourse:function(){
    var d=ui.draft;
    if(!confirm('Kurs „'+d.name+'“ mit allen Schüler:innen und Einträgen endgültig löschen?'))return;
    state.courses=state.courses.filter(function(c){return c.id!==d.id;});
    state.events=state.events.filter(function(e){return e.cid!==d.id;});
    if(state.settings.activeCourse===d.id)state.settings.activeCourse=null;
    save();ui.view=null;ui.draft=null;renderView();render();toast('Kurs gelöscht');
  },
  /* Namenssuche */
  cfocus:function(el,e){if(e&&e.target.closest('button'))return;var i=document.querySelector('.cin[data-ctx="'+el.dataset.ctx+'"]');if(i)i.focus();},
  cpick:function(el){var cx=el.dataset.ctx,i=document.querySelector('.cin[data-ctx="'+cx+'"]');ui.cq[cx]='';ui.ch[cx]=0;ui.copen[cx]=false;if(i){i.value='';i.focus();}comboToggle(cx,el.dataset.id);},
  ctoggle:function(el){var cx=el.dataset.ctx,i=document.querySelector('.cin[data-ctx="'+cx+'"]');ui.copen[cx]=!ui.copen[cx];if(ui.copen[cx]&&i)i.focus();comboRender(cx);},
  cdel:function(el){comboToggle(el.dataset.ctx,el.dataset.id);},
  selClear:function(){selClear('class');},
  ntApply:function(el){ntApplyTo(el.dataset.k,1);},
  /* Nachtragen */
  openNachtrag:openNachtrag,
  ntGo:ntGo,
  ncell:function(el,e){ntSetCell(el.dataset.sid,el.dataset.k,ui.nt.minus?-1:1);updateNt();},
  ntMode:function(el){ui.nt.minus=el.dataset.m==='minus';Array.prototype.forEach.call(document.querySelectorAll('[data-act=ntMode]'),function(b){b.setAttribute('aria-pressed',b===el);});},
  ntReset:function(){if(!ntTotal()||confirm('Alle Eingaben zurücksetzen?')){ui.nt.counts={};renderView();updateNt();comboRender('nt');}},
  /* Alte Daten */
  openImport:openImport,
  importGo:importGo,
  impMode:function(el){ui.imp.mode=el.dataset.m;renderView();updateImportPreview();},
  /* Auswertung */
  range:function(el){ui.range.p=el.dataset.p;renderMain();},
  tsort:function(el){var k=el.dataset.k;if(ui.tsort.k===k)ui.tsort.dir*=-1;else{ui.tsort.k=k;ui.tsort.dir=(k==='name'||k==='avg')?1:-1;}renderMain();},
  exportEval:exportEval,exportLog:exportLog,
  /* Einstellungen & Daten */
  addReason:function(){state.settings.jokerReasons.push('');save();renderMain();var i=document.querySelectorAll('[data-bind="reason"]');if(i.length)i[i.length-1].focus();},
  delReason:function(el){state.settings.jokerReasons.splice(+el.dataset.i,1);save();renderMain();renderDock();},
  addTag:function(){state.settings.tags.push({id:'t'+uid(),name:'',short:''});save();renderMain();var i=document.querySelectorAll('[data-bind="tagname"]');if(i.length)i[i.length-1].focus();},
  delTag:function(el){
    var t=state.settings.tags[+el.dataset.i];if(ui.stamp==='tag:'+(t&&t.id))ui.stamp=null;
    state.settings.tags.splice(+el.dataset.i,1);save();renderMain();renderDock();
  },
  backupNow:backupNow,
  backupLoad:function(){$('#fileIn').click();},
  snooze:function(){state.settings.backupSnooze=Date.now()+7*864e5;save();render();},
  wipe:function(){
    if(!confirm('Wirklich ALLE Kurse, Schüler:innen und Einträge auf diesem Gerät löschen?'))return;
    if(!confirm('Letzte Rückfrage: Das lässt sich nicht rückgängig machen. Alles löschen?'))return;
    state=defaults();save();ui.stamp=null;ui.tab='class';ui.view=null;renderView();closeSheet();render();toast('Alle Daten gelöscht');
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var h=A[el.dataset.act];if(h){if(el.disabled)return;h(el,e);}
});
/* Rechtsklick (am Handy: langes Drücken) nimmt einen Eintrag weg */
document.addEventListener('contextmenu',function(e){
  var el=e.target.closest&&e.target.closest('[data-act=ncell],[data-act=ntApply]');
  if(!el||!ui.nt||!ui.view||ui.view.type!=='nachtrag')return;
  e.preventDefault();
  if(el.dataset.act==='ncell'){ntSetCell(el.dataset.sid,el.dataset.k,-1);updateNt();}
  else ntApplyTo(el.dataset.k,-1);
});
/* Suchfeld: Listenpunkte per Maus wählen, ohne den Fokus zu verlieren */
document.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('.copts'))e.preventDefault();});
document.addEventListener('focusout',function(e){var t=e.target;if(t.classList&&t.classList.contains('cin')){var c=t.dataset.ctx;setTimeout(function(){if(document.activeElement!==t){ui.copen[c]=false;comboRender(c);}},120);}});
document.addEventListener('paste',function(e){
  var t=e.target;if(!(t.classList&&t.classList.contains('cin')))return;
  var txt=(e.clipboardData||window.clipboardData).getData('text');
  if(/[\n,;]/.test(txt)){e.preventDefault();ui.cq[t.dataset.ctx]=txt;comboCommit(t.dataset.ctx);}
});
document.addEventListener('keydown',function(e){
  if(e.target.classList&&e.target.classList.contains('cin')){comboKey(e,e.target);return;}
  if(e.key==='Escape'){if(ui.sheet)closeSheet();else if(ui.view){if(['course','import','nachtrag'].indexOf(ui.view.type)<0)closeView();}else if(ui.sel.length)selClear('class');else if(ui.stamp)A.stampOff();return;}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&ui.tab==='class'&&!ui.sheet&&!ui.view&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'')&&dockVisible()){
    var kk={'1':'r2','2':'r1','3':'r0','4':'rm1','5':'rm2',j:'joker'}[e.key.toLowerCase()];
    if(e.key==='/'){var ci=$('.cin[data-ctx="class"]');if(ci&&ci.offsetParent){e.preventDefault();ci.focus();}}
    else if(kk){e.preventDefault();A.stamp({dataset:{k:kk}});}
    else if(e.key.toLowerCase()==='z'){e.preventDefault();startPick();}
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('i[data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.classList&&el.classList.contains('cin')){var cx=el.dataset.ctx;ui.cq[cx]=el.value;ui.ch[cx]=0;ui.copen[cx]=true;comboRender(cx);return;}
  var b=el.dataset&&el.dataset.bind;if(!b)return;
  if(b==='cname')ui.draft.name=el.value;
  else if(b==='csubj')ui.draft.subject=el.value;
  else if(b==='every')ui.draft.jokerEvery=el.value;
  else if(b==='sfirst')ui.draft.students[+el.dataset.i].first=el.value;
  else if(b==='slast')ui.draft.students[+el.dataset.i].last=el.value;
  else if(b==='impText'){ui.imp.text=el.value;updateImportPreview();}
});
document.addEventListener('change',function(e){
  var el=e.target,b=el.dataset&&el.dataset.bind;
  if(el.id==='fileIn'){if(el.files&&el.files[0])importBackup(el.files[0]);el.value='';return;}
  if(!b)return;
  if(b==='date'){if(!el.value)return;ui.selDate=el.value===todayStr()?null:el.value;closeSheet();afterChange();}
  else if(b==='sort'){state.settings.sort=el.value;save();renderMain();}
  else if(b==='evdate')setEventDate(el.dataset.id,el.value);
  else if(b==='ntDate')ui.nt.date=el.value||'';
  else if(b==='ntCourse'){ui.nt.cid=el.value;ui.nt.counts={};ui.nt.sel=[];renderView();updateNt();comboRender('nt');}
  else if(b==='impCourse'){ui.imp.cid=el.value;updateImportPreview();}
  else if(b==='impDate'){ui.imp.date=el.value||'';updateImportPreview();}
  else if(b==='impCreate'){ui.imp.create=el.checked;updateImportPreview();}
  else if(b==='stampReason'){ui.stampReason=el.value;}
  else if(b==='closeAfter'){state.settings.closeAfter=el.checked;save();}
  else if(b==='reason'){state.settings.jokerReasons[+el.dataset.i]=el.value.trim();save();renderDock();}
  else if(b==='tagname'){var t=state.settings.tags[+el.dataset.i];if(t){t.name=el.value.trim();if(!t.short)t.short=t.name.slice(0,3);save();renderDock();}}
  else if(b==='tagshort'){var t2=state.settings.tags[+el.dataset.i];if(t2){t2.short=el.value.trim();save();}}
  else if(b==='rfrom'){ui.range.from=el.value;renderMain();}
  else if(b==='rto'){ui.range.to=el.value;renderMain();}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!ui.view&&!ui.sheet)render();});
window.addEventListener('resize',function(){if(dockVisible())document.documentElement.style.setProperty('--dockh',$('#dock').offsetHeight+'px');});

render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
})();
